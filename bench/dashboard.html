<title>Spark bench</title><style>
:root{
  --bg:#f6f7f9; --surface:#fff; --surface2:#f9fafb; --fg:#16181d; --mut:#6b7280;
  --faint:#9aa1ab; --line:#e5e7eb; --line2:#eef0f3;
  --ok:#15803d; --bad:#b91c1c; --warn:#b45309; --accent:#1d4ed8;
  --accent-soft:rgba(29,78,216,.10); --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px -12px rgba(16,24,40,.18);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d0f13; --surface:#14171d; --surface2:#191d24; --fg:#e6e8eb; --mut:#9aa1ab;
  --faint:#6b7280; --line:#262b33; --line2:#1e232a;
  --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; --accent:#93b4ff;
  --accent-soft:rgba(147,180,255,.14); --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -16px rgba(0,0,0,.8);
}}
*{box-sizing:border-box}
body{margin:0;padding:26px 22px 60px;background:var(--bg);color:var(--fg);
  font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
.page{max-width:1700px;margin:0 auto}
/* the titles borrow the code stack rather than load a webfont - this file has to open offline */
code,.num,h1,.panel h2{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-variant-numeric:tabular-nums}
/* plain text, but keeps the .unver badge's warn ink so the two titles still read as one voice */
h1{font-size:21px;margin:0 0 14px;letter-spacing:.06em;font-weight:600;line-height:1.25;
  color:var(--warn);text-transform:uppercase}
/* header facts reuse the detail panel's .chip, one fact per chip */
.chips.head{margin:0 0 16px;gap:9px}
.chips.head .chip{padding:8px 15px}
.chips.head b{font-size:13.5px}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.bar input[type=search]{flex:0 1 320px;padding:7px 11px;border:1px solid var(--line);
  border-radius:8px;background:var(--surface);color:var(--fg);font:13px/1.4 inherit}
.bar input[type=search]:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.tog{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:13px;
  padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);
  cursor:pointer;user-select:none}
.tog:hover{border-color:var(--accent)}
.tog input{accent-color:var(--accent);margin:0}
button.tog{font-family:inherit}
.spacer{flex:1}
.count{color:var(--faint);font-size:12.5px}

/* table */
.wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);overflow:auto;max-height:min(74vh,900px)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1080px}
th,td{padding:9px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line2)}
td{font-variant-numeric:tabular-nums}
td code{font-size:12.5px}
thead th{position:sticky;top:0;z-index:3;background:var(--surface2);color:var(--mut);
  font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
  border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
thead th:hover{color:var(--fg)}
thead th.nos{cursor:help;text-align:center;font-size:13px;color:var(--faint)}
thead th.nos:hover{color:var(--accent)}
/* CSS tooltip, not title= - the browser's own delay before showing title is ~1s and
   is not settable. Sits inside the th's sticky stacking context, so it paints over
   the rows and is not clipped by .wrap's scroll. */
thead th.nos::after{content:attr(data-tip);position:absolute;left:2px;top:calc(100% + 5px);
  z-index:10;white-space:nowrap;padding:5px 9px;border-radius:7px;pointer-events:none;
  background:var(--fg);color:var(--bg);box-shadow:var(--shadow);
  font-size:11.5px;font-weight:500;text-transform:none;letter-spacing:0;
  opacity:0;transition:opacity .1s}
thead th.nos:hover::after{opacity:1}
th .ar{opacity:.25;font-size:9px;margin-left:4px}
th.on{color:var(--accent)} th.on .ar{opacity:1}
td.l,th.l{text-align:left}
tbody tr.run{cursor:pointer}
tbody tr.run:hover td{background:var(--surface2)}
tbody tr.run.open td{background:var(--accent-soft)}
tbody tr.run.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
td.pick{width:34px;text-align:center;padding-left:12px}
/* keep the run's identity on screen when the metrics scroll sideways. The sticky
   cells need an opaque background or the scrolled columns show through. */
td.pick,td.runcell{position:sticky;left:0;z-index:2;background:var(--surface)}
td.runcell{left:34px}
thead th:nth-child(-n+2){position:sticky;left:0;z-index:5;background:var(--surface2)}
thead th:nth-child(2){left:34px}
tbody tr.run:hover td.pick,tbody tr.run:hover td.runcell{background:var(--surface2)}
tbody tr.run.open td.pick,tbody tr.run.open td.runcell{
  background:color-mix(in srgb,var(--accent) 11%,var(--surface))}
td.pick input{accent-color:var(--accent);cursor:pointer;margin:0}
.caret{display:inline-block;width:12px;color:var(--faint);transition:transform .12s;
  font-size:10px}
tr.run.open .caret{transform:rotate(90deg);color:var(--accent)}
.ref{font-weight:600;font-size:13px}
.when{color:var(--faint);font-size:11.5px;font-weight:400;margin-left:0}

/* badges */
.badge{font-size:10.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);
  letter-spacing:.02em;text-transform:uppercase;font-weight:600}
.full{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);
  background:color-mix(in srgb,var(--ok) 10%,transparent)}
.unver{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);
  background:color-mix(in srgb,var(--warn) 10%,transparent)}
.gates{display:inline-flex;gap:3px}
.g{width:16px;height:16px;line-height:16px;border-radius:4px;font-size:10px;
  text-align:center;font-weight:700;font-family:ui-monospace,monospace}
.gP{color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.gF{color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}
.gn{color:var(--faint);background:var(--surface2)}
.dash{color:var(--faint)}

/* in-cell magnitude bar: one hue, anchored under the right-aligned number */
.bar-cell{position:relative}
.bar-cell .fill{position:absolute;right:11px;bottom:4px;height:3px;border-radius:2px;
  background:var(--accent);opacity:.5}
td.score{font-weight:600}

/* detail */
tr.det>td{padding:0;background:var(--surface2);border-bottom:1px solid var(--line);
  text-align:left}
.det-in{padding:16px 18px 18px}
/* stat tile: muted label over its value, so the two never compete on one line */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:flex;flex-direction:column;gap:3px;line-height:1.3;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 12px}
.chip .k{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
  color:var(--mut)}
.chip b{color:var(--fg);font-weight:600;font-family:ui-monospace,monospace;font-size:12px}
.det h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--mut);font-weight:600}
table.lv{min-width:0;width:auto;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;overflow:hidden}
table.lv th{position:static;background:var(--surface2);cursor:default;font-size:10.5px}
table.lv td,table.lv th{padding:7px 12px}
table.lv tbody tr:last-child td{border-bottom:none}
table.lv tbody tr.tc td{background:var(--accent-soft)}
table.lv td.c{font-weight:700}
/* a header cell naming a run: the ref reads as a name, not as a column label */
table.lv th.who{text-transform:none;letter-spacing:0;font-size:11.5px;color:var(--fg)}
table.lv th.grp{color:var(--mut);border-bottom:1px solid var(--line2);text-align:center}
.ab{color:var(--accent);font-weight:700}
table.lv .sep{border-left:1px solid var(--line)}
table.lv tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--fg) 3%,transparent)}
table.lv tbody tr.tc td{background:var(--accent-soft)}
.note{margin-top:12px;color:var(--mut);font-size:12.5px;max-width:90ch;font-style:italic}

/* compare popup - native <dialog>, so backdrop/Esc/focus-trap come for free */
dialog.panel{margin:auto;width:min(1100px,94vw);max-height:88vh;overflow:auto;
  border:1px solid var(--line);border-radius:12px;padding:18px;
  background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
dialog.panel::backdrop{background:rgba(0,0,0,.45)}
/* the title and the ✕ stay put while a long diff scrolls under them */
.mhead{display:flex;align-items:center;gap:10px;position:sticky;top:-18px;z-index:1;
  background:var(--surface);padding:2px 0 9px;margin:-2px 0 0}
.mhead form{margin-left:auto}
.panel h2{font-size:16px;margin:0;font-weight:600;letter-spacing:.06em;line-height:1.25;
  color:var(--warn);text-transform:uppercase}
.panel h3{margin:16px 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--mut);font-weight:600}
.diff{display:grid;grid-template-columns:minmax(210px,auto) 1fr 1fr;
  border:1px solid var(--line);border-radius:9px;overflow:hidden}
.diff>div{padding:6px 11px;border-bottom:1px solid var(--line2);overflow-x:auto;
  font-size:12.5px;min-width:0}
.diff>div:nth-child(3n+2),.diff>div:nth-child(3n){border-left:1px solid var(--line)}
.diff>div:nth-child(6n+4),.diff>div:nth-child(6n+5),.diff>div:nth-child(6n+6){
  background:color-mix(in srgb,var(--fg) 3%,transparent)}
.diff .h{background:var(--surface2)!important;font-weight:600;font-size:11.5px;
  color:var(--fg);border-bottom:1px solid var(--line)}
.diff .h.lbl{color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-size:11px}
.diff code{white-space:pre-wrap;word-break:break-all}
.diff .h .when,th.who .when{display:block;font-weight:400;margin-top:1px}
.add{color:var(--ok)}.del{color:var(--bad)}
.good{color:var(--ok);font-weight:600}.worse{color:var(--bad);font-weight:600}
.hint{color:var(--mut);font-size:13px;margin:0}
.warnbox{margin-top:10px;padding:8px 11px;border-radius:8px;font-size:12.5px;color:var(--warn);
  background:color-mix(in srgb,var(--warn) 9%,transparent);
  border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.empty{padding:26px;text-align:center;color:var(--faint)}

lay): see docs/ENVS.md\n# Default image is Anemll \u2014 keep Stage-C-only VLLM_* keys commented unless\n# you build/run the Stage-C image and merge docker-compose.stage-c.override.yml.\n\n# Cluster\nWORKER_HOST=10.150.0.51\n# Worker-local checkout/deployment path. Leave blank to mirror the head path.\nWORKER_DIR=\n# Optional explicit worker checkout path. This is useful when the worker clone\n# lives somewhere different from the head checkout; it takes precedence over\n# WORKER_DIR when set.\nWORKER_SCRIPT_DIR=\nMASTER_ADDR=169.254.240.100\nMASTER_PORT=25000\nNODE_RANK=0\nHEADLESS=\n\n# Worker node should use:\n# NODE_RANK=1\n# HEADLESS=1\n\n# RoCE / InfiniBand (head node). On a QSFP ring, the worker's facing port\n# name often differs \u2014 set WORKER_NCCL_* below; start-*.sh passes them remotely.\nNCCL_IB_HCA=rocep1s0f1\nNCCL_SOCKET_IFNAME=enp1s0f1np1\nTP_SOCKET_IFNAME=enp1s0f1np1\nGLOO_SOCKET_IFNAME=enp1s0f1np1\n# Optional worker overrides (defaults to the head values if unset).\n# Set these on the HEAD .env; start-deepseek-v4-flash-dspark.sh injects them on\n# remote compose (shared/scp'd .env is fine). Do not rely on WORKER_* first in\n# docker-compose \u2014 that substitution is not rank-aware.\n# WORKER_NCCL_IB_HCA=rocep1s0f0\n# WORKER_NCCL_SOCKET_IFNAME=enp1s0f0np0\n# WORKER_TP_SOCKET_IFNAME=enp1s0f0np0\n# WORKER_GLOO_SOCKET_IFNAME=enp1s0f0np0\n# RoCEv2 GID index: start-*.sh resolves per node from sysfs by default\n# (NCCL_IB_GID_AUTO=1). Index differs per node/HCA and drifts after reboot;\n# a single shared literal on both ranks can wedge NCCL at init.\n# Pin only when you disable auto:\n# NCCL_IB_GID_AUTO=0\n# NCCL_IB_GID_INDEX=3\n# WORKER_NCCL_IB_GID_INDEX=6\n# Optional match IPs if the RoCE address is not the ifname primary IPv4:\n# NCCL_IB_GID_MATCH_IP=10.0.22.1\n# WORKER_NCCL_IB_GID_MATCH_IP=10.0.22.2\nNCCL_CROSS_NIC=1\n\n# Caches / model\nHF_CACHE=${HOME}/.cache/huggingface\n# Optional worker-local Hugging Face cache. Use this when the worker user/path\n# differs from the head node. If blank, the worker uses HF_CACHE.\nWORKER_HF_CACHE=\n# Prefer offline when both nodes already have a full hub cache (online re-download can fill worker disks).\nHF_HUB_OFFLINE=1\nTRANSFORMERS_OFFLINE=1\nHF_HUB_DISABLE_XET=1\n# Checkpoint flag: 0 = official 0731, 1 = abliterated (Keys).\n# start- / prepare- resolve DSPARK_MODEL from this \u2014 do not set DSPARK_MODEL by hand.\nABLITERATED=0\nDSPARK_MODEL_OFFICIAL=deepseek-ai/DeepSeek-V4-Flash-0731\nDSPARK_MODEL_ABLITERATED=drowzeys/keys-DeepSeekV4-Flash-GA-0731-Dspark-Abliterated-32-32\n# Pin official HF revision (issue #19). Default when unset: tested 9e165c30\u2026\n# Set DSPARK_REVISION= (empty) to follow tip of main. Abliterated uses\n# DSPARK_REVISION_ABLITERATED (empty = tip of that repo).\nDSPARK_REVISION=7872f01b1d1fe23eabc4c98b48bffcef5a386062\n# DSPARK_REVISION_ABLITERATED=\n# Optional pin for the 0731 encoder inside the container. Leave empty to auto-find\n# encoding/encoding_dsv4.py under the selected model's HF hub snapshot (prefers\n# DSPARK_REVISION when set).\nDSPARK_ENCODING_FILE=\nSERVED_MODEL_NAME=deepseek-v4-flash-dspark\n# Bind to 0.0.0.0 when Hermes/OpenClaw or another machine must reach the API.\n# For a head-node-only test, set this back to 127.0.0.1.\nVLLM_HOST=0.0.0.0\n# API listen port. The launcher also accepts a temporary --port override.\nVLLM_PORT=8000\n# Explicit per-node host IPs prevent distributed vLLM/ZeroMQ from binding the\n# worker to the head node's fabric address. Set these to each node's RoCE IP.\nVLLM_HOST_IP=169.254.240.100\nWORKER_VLLM_HOST_IP=169.254.16.74\n\n# Prebuilt Anemll DSpark vLLM GX10 image (https://github.com/Anemll/dspark-vllm-gx10).\n# Digest-pinned manifest (immutable). Same bytes as the bare tag today; re-tagging\n# cannot silently change what you run. Bump deliberately:\n#   1) docker pull ghcr.io/anemll/dspark-vllm-gx10:0.1.1\n#   2) get its manifest digest (docker inspect --format '{{index .RepoDigests 0}}')\n#   3) update the @sha256: below.\nDSPARK_VLLM_IMAGE=ghcr.io/anemll/dspark-vllm-gx10:0.1.1@sha256:a83948492cf13df455170fb42885f5ef4db54fefe0feff0f841ecbff464ac9d8\n# Alternative: build locally with ./build-dspark-vllm-runtime.sh \u2192 vllm-dspark-runtime:dspark-nvfp4-stage-c\n# and merge docker-compose.stage-c.override.yml (see docs/ENVS.md).\n\n# Serving profile. DSpark k must be >= checkpoint dspark_block_size (5);\n# k<5 truncates draft blocks (silent on Anemll 0.25.2, rejected on stock 0.26+).\n# Capture size = MAX_NUM_SEQS * (MTP_NUM_TOKENS + 1); at k=5 / seqs=6 that is 36 \u2014\n# if graph capture OOMs, lower GPU_MEMORY_UTILIZATION_TEXT / _VISION toward ~0.78.\nMAX_MODEL_LEN=262144\nMAX_NUM_SEQS=10\nMAX_NUM_BATCHED_TOKENS=16384\n# Main GPU util is chosen by ENABLE_VL_SIDECAR (see Experimental: Vision in README).\n# Do not set GPU_MEMORY_UTILIZATION here \u2014 start-deepseek-v4-flash-dspark.sh\n# exports it from these two profiles:\n#   ENABLE_VL_SIDECAR=0 \u2192 GPU_MEMORY_UTILIZATION_TEXT   (larger KV)\n#   ENABLE_VL_SIDECAR=1 \u2192 GPU_MEMORY_UTILIZATION_VISION (room for VL)\nGPU_MEMORY_UTILIZATION_TEXT=0.835\nGPU_MEMORY_UTILIZATION_VISION=0.80\nMTP_NUM_TOKENS=5\n# Default reasoning mode: off, low, high, or max. \"max\" enables full\n# thinking/reasoning effort by default; request-level overrides still win.\nDEFAULT_THINKING=off\n\n# Issue #22 hotfix: automatically patches nvfp4_ds_mla long-context decode\n# regression on every start.  Set to 1 to skip (e.g. if you've already\n# applied the hotfix manually or are using a patched image).\n# DSPARK_SKIP_HOTFIX=0\n\n# No sampling override. The launcher keeps --generation-config vllm only.\n# Explicit client request parameters still win.\n\n# Higher-throughput short-context profile from the Keys concurrency patch:\n# MAX_MODEL_LEN=200000\n# MAX_NUM_SEQS=16\n#\n# Conservative prior agent lane:\n# MAX_MODEL_LEN=1048576\n# MAX_NUM_SEQS=6\n# GPU_MEMORY_UTILIZATION=0.80\n#\n# Context and concurrency share one KV pool. The conservative 1M-token lane\n# keeps 6 active sequence slots for long-context agent traffic.\n# Normal agent turns are much shorter than the maximum; multiple simultaneous\n# full-context requests may still queue depending on the live KV pool.\n\n# ---------------------------------------------------------------------------\n# Anemll 0.1.1-safe vLLM / runtime knobs (default compose injects these)\n# ---------------------------------------------------------------------------\nVLLM_USE_FLASHINFER_SAMPLER=1\nVLLM_USE_BREAKABLE_CUDAGRAPH=0\nVLLM_USE_B12X_MOE=1\nVLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM=0\nVLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M=64\nVLLM_B12X_W4A16_FORCE_TILE_CONFIG=\n\nVLLM_ALLOW_LONG_MAX_MODEL_LEN=1\nVLLM_SPARSE_INDEXER_MAX_LOGITS_MB=256\nVLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=0\n\n# CuTeDSL / b12x compile target for GB10 (not a VLLM_* registry key).\nCUTE_DSL_ARCH=sm_121a\nTORCH_CUDA_ARCH_LIST=12.1a\nFLASHINFER_CUDA_ARCH_LIST=12.1a\nFLASHINFER_DISABLE_VERSION_CHECK=1\nTILELANG_CLEANUP_TEMP_FILES=1\nDG_JIT_USE_NVRTC=0\nDG_JIT_NVCC_COMPILER=/usr/local/cuda/bin/nvcc\nNCCL_NET=IB\nNCCL_IB_DISABLE=0\nNCCL_CUMEM_ENABLE=0\nNCCL_IGNORE_CPU_AFFINITY=1\nNCCL_DEBUG=WARN\nNCCL_NVLS_ENABLE=0\nPYTORCH_CUDA_ALLOC_CONF=expandable_segments:True\n\n# ---------------------------------------------------------------------------\n# Stage-C overlay only \u2014 DO NOT enable on Anemll 0.1.1\n# Uncomment when DSPARK_VLLM_IMAGE is the Stage-C build AND you merge\n# docker-compose.stage-c.override.yml. On Anemll these VLLM_* keys warn:\n#   \"Unknown vLLM environment variable detected: \u2026\"\n# and are ignored. Full matrix: docs/ENVS.md\n# ---------------------------------------------------------------------------\n# VLLM_USE_B12X_WO_PROJECTION=1\n# VLLM_DSPARK_CONFIDENCE_THRESHOLD=0.0\n# VLLM_DSPARK_CONFIDENCE_SCHEDULER=off\n# VLLM_DSPARK_LOCAL_ARGMAX=1\n# VLLM_DSPARK_REPLICATE_MARKOV_W1=1\n# VLLM_DSPARK_FUSED_MARKOV_ARGMAX=0\n# VLLM_DSPARK_GPU_REJECTED_CONTEXT_MASK=1\n# VLLM_DSPARK_REFERENCE_KV_QUANT_DEQUANT=0\n# DSPARK_SLOT_CLAMP=1\n# VLLM_DSPARK_HARDWARE_SCHEDULER_EARLY_STOP=1\n# B12X_W4A16_TC_DECODE=0\n# VLLM_DSV4_B12X_COMPRESSED_MLA=0\n# VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE=0\n# VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE_EXACT=0\n# VLLM_TRITON_MLA_SPARSE=1\n# VLLM_SKIP_INIT_MEMORY_CHECK=1\n\n# ---------------------------------------------------------------------------\n# Vision mode flag (one switch) + VL sidecar + MCP harness install\n# ---------------------------------------------------------------------------\n# ENABLE_VL_SIDECAR=1 \u2192 start Qwen3-VL TP=2 on :8889 + MCP install, and set\n#   0731 util from GPU_MEMORY_UTILIZATION_VISION (default 0.80).\n# ENABLE_VL_SIDECAR=0 \u2192 text-only 0731, util from GPU_MEMORY_UTILIZATION_TEXT\n#   (default 0.835) for a larger KV pool.\n# Flip the flag, then ./stop-\u2026 && ./start-\u2026 (full restart required).\n#\n# Measured Available KV (this cluster, Anemll 0.1.1, 2026-08-11):\n#   text (flag=0, util 0.835): main ~18.08 GiB / ~2.49M tokens\n#   vision (flag=1, util 0.80 + VL 0.04): main 13.37 GiB / 1.37M + VL 1.54 GiB / 84k\n# Default: off (text-only, larger main KV). Vision/VL coexist is deferred to a\n# follow-up PR \u2014 leave knobs commented; they are unused while the flag is 0.\nENABLE_VL_SIDECAR=0\n# Do not download VL weights on text-only prepare (set 1 only for a vision PR).\nPREPARE_VL_SIDECAR_MODEL=0\n# VL_SIDECAR_MODEL=cyankiwi/Qwen3-VL-4B-Instruct-AWQ-4bit\n# VL_SIDECAR_SERVED_NAME=qwen3-vl-4b\n# VL_SIDECAR_PORT=8889\n# VL_SIDECAR_TP_SIZE=2\n# VL_SIDECAR_NNODES=2\n# VL_SIDECAR_MASTER_PORT=25100\n# VL_SIDECAR_GPU_UTIL=0.04\n# VL_SIDECAR_MAX_NUM_SEQS=4\n# VL_SIDECAR_MAX_MODEL_LEN=32768\n# VL_SIDECAR_KV_CACHE_DTYPE=int4_per_token_head\n# VL_SIDECAR_ATTENTION_BACKEND=TRITON_ATTN\n# Optional: VL_SIDECAR_KV_CACHE_MEMORY_BYTES=367001600\n# VL weights: ./prepare-dspark-model-cache.sh downloads VL_SIDECAR_MODEL on\n# head and worker when PREPARE_VL_SIDECAR_MODEL=1 (TP=2 needs both caches).\n# After sidecar is healthy, start can register MCP into detected harnesses\n# only when ENABLE_VL_SIDECAR=1 (installer also no-ops if the flag is off).\n# INSTALL_VISION_MCP=0 skips harness registration even when vision is on.\n# INSTALL_VISION_MCP=1\n# VISION_MCP_HARNESSES=auto\n# VISION_MCP_HARNESSES=pi,omp,hermes,opencode,goose,grok,openclaw,zcode,prime,factory,commandcode\n\n# --- local: hold issue #26 hybrid prefix-cache hotfix (issue #39 tool-name regression,\n# bisected to #26 by siraustin; v2 fix on 103af68c is unvalidated). Remove both lines to A/B.\nDSPARK_ISSUE26_HOTFIX=/home/nvidia/dspark-mia/patches/noop.py\nVLLM_PREFIX_CACHE_RETENTION_INTERVAL=\n\n# --- local: undo the #27 prefill serialization. Measured 2026-08-14 on our box:\n# cap=1 + 1024-token chunks moved 18K-prompt work from prefill into queue\n# (q 0.02s -> 6.68s at c=10), costing 24% on score vs cbd719f. PR #44 decode\n# floor stays on and covers the per-step starvation #27 targeted.\nDSPARK_ISSUE27_HOTFIX=/home/nvidia/dspark-mia/patches/noop.py\nLONG_PREFILL_TOKEN_THRESHOLD=0\nENABLE_VLLM_GB10_PATCH=0\nDSPARK_AUTOTUNE_SHAPES_HOTFIX=/home/nvidia/dspark-mia/patches/noop.py\nDSPARK_DECODE_BUCKETS_HOTFIX=/home/nvidia/dspark-mia/patches/noop.py\nDSPARK_DRAFT_SAMPLE_METHOD=probabilistic\nDSPARK_DISABLE_SPEC=0", "hotfixes": {"10.150.0.50": ["issue43-hotfix", "issue55-hotfix"], "10.150.0.51": ["issue43-hotfix", "issue55-hotfix"]}, "deployment": "compose", "config_file": "env.dspark", "workload": null, "gates": {"smoke": true, "toolprobe": true, "loadgen": true, "decode_shapes": null}, "metrics": {"n": 2, "score": 101.6305086508753, "ttft_p95": 7.1521730499807745, "tps_req": 22.91122396246565, "tps_agg": 75.72301177950477, "spread": 10.080372574285223, "preempt": 0.0, "cache": 83.81332889406804, "queue": 1.371195539832115e-05, "prefill": 4.821147829829716}, "levels": [{"c": 1, "n": 2, "score": 38.05380553907207, "ttft_p50": 1.4767434321111068, "ttft_p95": 1.4767434321111068, "total_p95": 7.590714 cts them on\n# remote compose (shared/scp'd .env is fine). Do not rely on WORKER_* first in\n# docker-compose \u2014 that substitution is not rank-aware.\n# WORKER_NCCL_IB_HCA=rocep1s0f0\n# WORKER_NCCL_SOCKET_IFNAME=enp1s0f0np0\n# WORKER_TP_SOCKET_IFNAME=enp1s0f0np0\n# WORKER_GLOO_SOCKET_IFNAME=enp1s0f0np0\n# RoCEv2 GID index: start-*.sh resolves per node from sysfs by default\n# (NCCL_IB_GID_AUTO=1). Index differs per node/HCA and drifts after reboot;\n# a single shared literal on both ranks can wedge NCCL at init.\n# Pin only when you disable auto:\n# NCCL_IB_GID_AUTO=0\n# NCCL_IB_GID_INDEX=3\n# WORKER_NCCL_IB_GID_INDEX=6\n# Optional match IPs if the RoCE address is not the ifname primary IPv4:\n# NCCL_IB_GID_MATCH_IP=10.0.22.1\n# WORKER_NCCL_IB_GID_MATCH_IP=10.0.22.2\nNCCL_CROSS_NIC=1\n\n# Caches / model\nHF_CACHE=${HOME}/.cache/huggingface\n# Optional worker-local Hugging Face cache. Use this when the worker user/path\n# differs from the head node. If blank, the worker uses HF_CACHE.\nWORKER_HF_CACHE=\n# Prefer offline when both nodes already have a full hub cache (online re-download can fill worker disks).\nHF_HUB_OFFLINE=1\nTRANSFORMERS_OFFLINE=1\nHF_HUB_DISABLE_XET=1\n# Checkpoint flag: 0 = official 0731, 1 = abliterated (Keys).\n# start- / prepare- resolve DSPARK_MODEL from this \u2014 do not set DSPARK_MODEL by hand.\nABLITERATED=0\nDSPARK_MODEL_OFFICIAL=deepseek-ai/DeepSeek-V4-Flash-0731\nDSPARK_MODEL_ABLITERATED=drowzeys/keys-DeepSeekV4-Flash-GA-0731-Dspark-Abliterated-32-32\n# Pin official HF revision (issue #19). Default when unset: tested 9e165c30\u2026\n# Set DSPARK_REVISION= (empty) to follow tip of main. Abliterated uses\n# DSPARK_REVISION_ABLITERATED (empty = tip of that repo).\nDSPARK_REVISION=7872f01b1d1fe23eabc4c98b48bffcef5a386062\n# DSPARK_REVISION_ABLITERATED=\n# Optional pin for the 0731 encoder inside the container. Leave empty to auto-find\n# encoding/encoding_dsv4.py under the selected model's HF hub snapshot (prefers\n# DSPARK_REVISION when set).\nDSPARK_ENCODING_FILE=\nSERVED_MODEL_NAME=deepseek-v4-flash-dspark\n# Bind to 0.0.0.0 when Hermes/OpenClaw or another machine must reach the API.\n# For a head-node-only test, set this back to 127.0.0.1.\nVLLM_HOST=0.0.0.0\n# API listen port. The launcher also accepts a temporary --port override.\nVLLM_PORT=8000\n# Explicit per-node host IPs prevent distributed vLLM/ZeroMQ from binding the\n# worker to the head node's fabric address. Set these to each node's RoCE IP.\nVLLM_HOST_IP=169.254.240.100\nWORKER_VLLM_HOST_IP=169.254.16.74\n\n# Prebuilt Anemll DSpark vLLM GX10 image (https://github.com/Anemll/dspark-vllm-gx10).\n# Digest-pinned manifest (immutable). Same bytes as the bare tag today; re-tagging\n# cannot silently change what you run. Bump deliberately:\n#   1) docker pull ghcr.io/anemll/dspark-vllm-gx10:0.1.1\n#   2) get its manifest digest (docker inspect --format '{{index .RepoDigests 0}}')\n#   3) update the @sha256: below.\nDSPARK_VLLM_IMAGE=ghcr.io/anemll/dspark-vllm-gx10:0.1.1@sha256:a83948492cf13df455170fb42885f5ef4db54fefe0feff0f841ecbff464ac9d8\n# Alternative: build locally with ./build-dspark-vllm-runtime.sh \u2192 vllm-dspark-runtime:dspark-nvfp4-stage-c\n# and merge docker-compose.stage-c.override.yml (see docs/ENVS.md).\n\n# Serving profile. DSpark k must be >= checkpoint dspark_block_size (5);\n# k<5 truncates draft blocks (silent on Anemll 0.25.2, rejected on stock 0.26+).\n# Capture size = MAX_NUM_SEQS * (MTP_NUM_TOKENS + 1); at k=5 / seqs=6 that is 36 \u2014\n# if graph capture OOMs, lower GPU_MEMORY_UTILIZATION_TEXT / _VISION toward ~0.78.\nMAX_MODEL_LEN=262144\nMAX_NUM_SEQS=10\nMAX_NUM_BATCHED_TOKENS=16384\n# Main GPU util is chosen by ENABLE_VL_SIDECAR (see Experimental: Vision in README).\n# Do not set GPU_MEMORY_UTILIZATION here \u2014 start-deepseek-v4-flash-dspark.sh\n# exports it from these two profiles:\n#   ENABLE_VL_SIDECAR=0 \u2192 GPU_MEMORY_UTILIZATION_TEXT   (larger KV)\n#   ENABLE_VL_SIDECAR=1 \u2192 GPU_MEMORY_UTILIZATION_VISION (room for VL)\nGPU_MEMORY_UTILIZATION_TEXT=0.835\nGPU_MEMORY_UTILIZATION_VISION=0.80\nMTP_NUM_TOKENS=5\n# Default reasoning mode: off, low, high, or max. \"max\" enables full\n# thinking/reasoning effort by default; request-level overrides still win.\nDEFAULT_THINKING=off\n\n# Issue #22 hotfix: automatically patches nvfp4_ds_mla long-context decode\n# regression on every start.  Set to 1 to skip (e.g. if you've already\n# applied the hotfix manually or are using a patched image).\n# DSPARK_SKIP_HOTFIX=0\n\n# No sampling override. The launcher keeps --generation-config vllm only.\n# Explicit client request parameters still win.\n\n# Higher-throughput short-context profile from the Keys concurrency patch:\n# MAX_MODEL_LEN=200000\n# MAX_NUM_SEQS=16\n#\n# Conservative prior agent lane:\n# MAX_MODEL_LEN=1048576\n# MAX_NUM_SEQS=6\n# GPU_MEMORY_UTILIZATION=0.80\n#\n# Context and concurrency share one KV pool. The conservative 1M-token lane\n# keeps 6 active sequence slots for long-context agent traffic.\n# Normal agent turns are much shorter than the maximum; multiple simultaneous\n# full-context requests may still queue depending on the live KV pool.\n\n# ---------------------------------------------------------------------------\n# Anemll 0.1.1-safe vLLM / runtime knobs (default compose injects these)\n# ---------------------------------------------------------------------------\nVLLM_USE_FLASHINFER_SAMPLER=1\nVLLM_USE_BREAKABLE_CUDAGRAPH=0\nVLLM_USE_B12X_MOE=1\nVLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM=0\nVLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M=64\nVLLM_B12X_W4A16_FORCE_TILE_CONFIG=\n\nVLLM_ALLOW_LONG_MAX_MODEL_LEN=1\nVLLM_SPARSE_INDEXER_MAX_LOGITS_MB=256\nVLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=0\n\n# CuTeDSL / b12x compile target for GB10 (not a VLLM_* registry key).\nCUTE_DSL_ARCH=sm_121a\nTORCH_CUDA_ARCH_LIST=12.1a\nFLASHINFER_CUDA_ARCH_LIST=12.1a\nFLASHINFER_DISABLE_VERSION_CHECK=1\nTILELANG_CLEANUP_TEMP_FILES=1\nDG_JIT_USE_NVRTC=0\nDG_JIT_NVCC_COMPILER=/usr/local/cuda/bin/nvcc\nNCCL_NET=IB\nNCCL_IB_DISABLE=0\nNCCL_CUMEM_ENABLE=0\nNCCL_IGNORE_CPU_AFFINITY=1\nNCCL_DEBUG=WARN\nNCCL_NVLS_ENABLE=0\nPYTORCH_CUDA_ALLOC_CONF=expandable_segments:True\n\n# ---------------------------------------------------------------------------\n# Stage-C overlay only \u2014 DO NOT enable on Anemll 0.1.1\n# Uncomment when DSPARK_VLLM_IMAGE is the Stage-C build AND you merge\n# docker-compose.stage-c.override.yml. On Anemll these VLLM_* keys warn:\n#   \"Unknown vLLM environment variable detected: \u2026\"\n# and are ignored. Full matrix: docs/ENVS.md\n# ---------------------------------------------------------------------------\n# VLLM_USE_B12X_WO_PROJECTION=1\n# VLLM_DSPARK_CONFIDENCE_THRESHOLD=0.0\n# VLLM_DSPARK_CONFIDENCE_SCHEDULER=off\n# VLLM_DSPARK_LOCAL_ARGMAX=1\n# VLLM_DSPARK_REPLICATE_MARKOV_W1=1\n# VLLM_DSPARK_FUSED_MARKOV_ARGMAX=0\n# VLLM_DSPARK_GPU_REJECTED_CONTEXT_MASK=1\n# VLLM_DSPARK_REFERENCE_KV_QUANT_DEQUANT=0\n# DSPARK_SLOT_CLAMP=1\n# VLLM_DSPARK_HARDWARE_SCHEDULER_EARLY_STOP=1\n# B12X_W4A16_TC_DECODE=0\n# VLLM_DSV4_B12X_COMPRESSED_MLA=0\n# VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE=0\n# VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE_EXACT=0\n# VLLM_TRITON_MLA_SPARSE=1\n# VLLM_SKIP_INIT_MEMORY_CHECK=1\n\n# ---------------------------------------------------------------------------\n# Vision mode flag (one switch) + VL sidecar + MCP harness install\n# ---------------------------------------------------------------------------\n# ENABLE_VL_SIDECAR=1 \u2192 start Qwen3-VL TP=2 on :8889 + MCP install, and set\n#   0731 util from GPU_MEMORY_UTILIZATION_VISION (default 0.80).\n# ENABLE_VL_SIDECAR=0 \u2192 text-only 0731, util from GPU_MEMORY_UTILIZATION_TEXT\n#   (default 0.835) for a larger KV pool.\n# Flip the flag, then ./stop-\u2026 && ./start-\u2026 (full restart required).\n#\n# Measured Available KV (this cluster, Anemll 0.1.1, 2026-08-11):\n#   text (flag=0, util 0.835): main ~18.08 GiB / ~2.49M tokens\n#   vision (flag=1, util 0.80 + VL 0.04): main 13.37 GiB / 1.37M + VL 1.54 GiB / 84k\n# Default: off (text-only, larger main KV). Vision/VL coexist is deferred to a\n# follow-up PR \u2014 leave knobs commented; they are unused while the flag is 0.\nENABLE_VL_SIDECAR=0\n# Do not download VL weights on text-only prepare (set 1 only for a vision PR).\nPREPARE_VL_SIDECAR_MODEL=0\n# VL_SIDECAR_MODEL=cyankiwi/Qwen3-VL-4B-Instruct-AWQ-4bit\n# VL_SIDECAR_SERVED_NAME=qwen3-vl-4b\n# VL_SIDECAR_PORT=8889\n# VL_SIDECAR_TP_SIZE=2\n# VL_SIDECAR_NNODES=2\n# VL_SIDECAR_MASTER_PORT=25100\n# VL_SIDECAR_GPU_UTIL=0.04\n# VL_SIDECAR_MAX_NUM_SEQS=4\n# VL_SIDECAR_MAX_MODEL_LEN=32768\n# VL_SIDECAR_KV_CACHE_DTYPE=int4_per_token_head\n# VL_SIDECAR_ATTENTION_BACKEND=TRITON_ATTN\n# Optional: VL_SIDECAR_KV_CACHE_MEMORY_BYTES=367001600\n# VL weights: ./prepare-dspark-model-cache.sh downloads VL_SIDECAR_MODEL on\n# head and worker when PREPARE_VL_SIDECAR_MODEL=1 (TP=2 needs both caches).\n# After sidecar is healthy, start can register MCP into detected harnesses\n# only when ENABLE_VL_SIDECAR=1 (installer also no-ops if the flag is off).\n# INSTALL_VISION_MCP=0 skips harness registration even when vision is on.\n# INSTALL_VISION_MCP=1\n# VISION_MCP_HARNESSES=auto\n# VISION_MCP_HARNESSES=pi,omp,hermes,opencode,goose,grok,openclaw,zcode,prime,factory,commandcode\n\n# --- local: hold issue #26 hybrid prefix-cache hotfix (issue #39 tool-name regression,\n# bisected to #26 by siraustin; v2 fix on 103af68c is unvalidated). Remove both lines to A/B.\nDSPARK_ISSUE26_HOTFIX=/home/nvidia/dspark-mia/patches/noop.py\nVLLM_PREFIX_CACHE_RETENTION_INTERVAL=\n\n# --- local: undo the #27 prefill serialization. Measured 2026-08-14 on our box:\n# cap=1 + 1024-token chunks moved 18K-prompt work from prefill into queue\n# (q 0.02s -> 6.68s at c=10), costing 24% on score vs cbd719f. PR #44 decode\n# floor stays on and covers the per-step starvation #27 targeted.\nDSPARK_ISSUE27_HOTFIX=/home/nvidia/dspark-mia/patches/noop.py\nLONG_PREFILL_TOKEN_THRESHOLD=0\nENABLE_VLLM_GB10_PATCH=0\nDSPARK_AUTOTUNE_SHAPES_HOTFIX=/home/nvidia/dspark-mia/patches/noop.py\nDSPARK_DECODE_BUCKETS_HOTFIX=/home/nvidia/dspark-mia/patches/noop.py\nDSPARK_DRAFT_SAMPLE_METHOD=probabilistic\nDSPARK_DISABLE_SPEC=1", "hotfixes": {"10.150.0.50": ["issue43-hotfix", "issue55-hotfix"], "10.150.0.51": ["issue43-hotfix", "issue55-hotfix"]}, "deployment": "compose", "config_file": "env.dspark", "workload": null, "gates": {"smoke": true, "toolprobe": true, "loadgen": true, "decode_shapes": null}, "metrics": {"n": 2, "score": 157.75481343369995, "ttft_p95": 6.999558070092462, "tps_req": 12.220733497945004, "tps_agg": 49.35660800759077, "spread": 1.714110682224371, "preempt": 0.0, "cache": 83.81332889406804, "queue": 1.0033650323748588e-05, "prefill": 4.700073945033363}, "levels": [{"c": 1, "n": 2, "score": 62.47344075232045, "ttft_p50": 1.449178876588121, "ttft_p95": 1.449178876588121, "total_p95": 12.457950655487366, "tps_req": 27.160359252020918, "tps_agg": 24.075986813989836, "tpot": 0.03681863471203761, "out": 300.0, "prompt": 18021.0, "queue": 1.2768548913300037e-05, "prefill": 1.4034131114603952, "cache": 83.81332889406804, "preempt": 0.0, "ok": "2/2"}, {"c": 5, "n": 2, "score": 157.7400136590906, "ttft_p50": 6.998054934549145, "ttft_p95": 6.999558070092462, "total_p95": 30.38102164049633, "tps_req": 12.220733497945004, "tps_agg": 49.35660800759077, "tpot": 0.0818380153888251, "out": 300.0, "prompt": 18021.0, "queue": 1.0033650323748588e-05, "prefill": 4.700073945033363, "cache": 83.81332889406804, "preempt": 0.0, "ok": "10/10"}, {"c": 10, "n": 2, "score": 215.87845357962945, "ttft_p50": 9.09839263849426, "ttft_p95": 13.831104884622619, "total_p95": 39.52332955750171, "tps_req": 10.223350969226345, "tps_agg": 75.85771890255704, "tpot": 0.09781552792314976, "out": 300.0, "prompt": 18021.0, "queue": 0.012038870167452842, "prefill": 8.883345408621244, "cache": 83.81332889406804, "preempt": 0.0, "ok": "20/20"}], "note": null}, {"dir": "2026-08-15T14-49Z HE=\n# Prefer offline when both nodes already have a full hub cache (online re-download can fill worker disks).\nHF_HUB_OFFLINE=1\nTRANSFORMERS_OFFLINE=1\nHF_HUB_DISABLE_XET=1\n# Checkpoint flag: 0 = official 0731, 1 = abliterated (Keys).\n# start- / prepare- resolve DSPARK_MODEL from this \u2014 do not set DSPARK_MODEL by hand.\nABLITERATED=0\nDSPARK_MODEL_OFFICIAL=deepseek-ai/DeepSeek-V4-Flash-0731\nDSPARK_MODEL_ABLITERATED=drowzeys/keys-DeepSeekV4-Flash-GA-0731-Dspark-Abliterated-32-32\n# Pin official HF revision (issue #19). Default when unset: tested 9e165c30\u2026\n# Set DSPARK_REVISION= (empty) to follow tip of main. Abliterated uses\n# DSPARK_REVISION_ABLITERATED (empty = tip of that repo).\nDSPARK_REVISION=7872f01b1d1fe23eabc4c98b48bffcef5a386062\n# DSPARK_REVISION_ABLITERATED=\n# Optional pin for the 0731 encoder inside the container. Leave empty to auto-find\n# encoding/encoding_dsv4.py under the selected model's HF hub snapshot (prefers\n# DSPARK_REVISION when set).\nDSPARK_ENCODING_FILE=\nSERVED_MODEL_NAME=deepseek-v4-flash-dspark\n# Bind to 0.0.0.0 when Hermes/OpenClaw or another machine must reach the API.\n# For a head-node-only test, set this back to 127.0.0.1.\nVLLM_HOST=0.0.0.0\n# API listen port. The launcher also accepts a temporary --port override.\nVLLM_PORT=8000\n# Explicit per-node host IPs prevent distributed vLLM/ZeroMQ from binding the\n# worker to the head node's fabric address. Set these to each node's RoCE IP.\nVLLM_HOST_IP=169.254.240.100\nWORKER_VLLM_HOST_IP=169.254.16.74\n\n# Prebuilt Anemll DSpark vLLM GX10 image (https://github.com/Anemll/dspark-vllm-gx10).\n# Digest-pinned manifest (immutable). Same bytes as the bare tag today; re-tagging\n# cannot silently change what you run. Bump deliberately:\n#   1) docker pull ghcr.io/anemll/dspark-vllm-gx10:0.1.1\n#   2) get its manifest digest (docker inspect --format '{{index .RepoDigests 0}}')\n#   3) update the @sha256: below.\nDSPARK_VLLM_IMAGE=ghcr.io/anemll/dspark-vllm-gx10:0.1.1@sha256:a83948492cf13df455170fb42885f5ef4db54fefe0feff0f841ecbff464ac9d8\n# Alternative: build locally with ./build-dspark-vllm-runtime.sh \u2192 vllm-dspark-runtime:dspark-nvfp4-stage-c\n# and merge docker-compose.stage-c.override.yml (see docs/ENVS.md).\n\n# Serving profile. DSpark k must be >= checkpoint dspark_block_size (5);\n# k<5 truncates draft blocks (silent on Anemll 0.25.2, rejected on stock 0.26+).\n# Capture size = MAX_NUM_SEQS * (MTP_NUM_TOKENS + 1); at k=5 / seqs=6 that is 36 \u2014\n# if graph capture OOMs, lower GPU_MEMORY_UTILIZATION_TEXT / _VISION toward ~0.78.\nMAX_MODEL_LEN=262144\nMAX_NUM_SEQS=10\nMAX_NUM_BATCHED_TOKENS=16384\n# Main GPU util is chosen by ENABLE_VL_SIDECAR (see Experimental: Vision in README).\n# Do not set GPU_MEMORY_UTILIZATION here \u2014 start-deepseek-v4-flash-dspark.sh\n# exports it from these two profiles:\n#   ENABLE_VL_SIDECAR=0 \u2192 GPU_MEMORY_UTILIZATION_TEXT   (larger KV)\n#   ENABLE_VL_SIDECAR=1 \u2192 GPU_MEMORY_UTILIZATION_VISION (room for VL)\nGPU_MEMORY_UTILIZATION_TEXT=0.835\nGPU_MEMORY_UTILIZATION_VISION=0.80\nMTP_NUM_TOKENS=5\n# Default reasoning mode: off, low, high, or max. \"max\" enables full\n# thinking/reasoning effort by default; request-level overrides still win.\nDEFAULT_THINKING=off\n\n# Issue #22 hotfix: automatically patches nvfp4_ds_mla long-context decode\n# regression on every start.  Set to 1 to skip (e.g. if you've already\n# applied the hotfix manually or are using a patched image).\n# DSPARK_SKIP_HOTFIX=0\n\n# No sampling override. The launcher keeps --generation-config vllm only.\n# Explicit client request parameters still win.\n\n# Higher-throughput short-context profile from the Keys concurrency patch:\n# MAX_MODEL_LEN=200000\n# MAX_NUM_SEQS=16\n#\n# Conservative prior agent lane:\n# MAX_MODEL_LEN=1048576\n# MAX_NUM_SEQS=6\n# GPU_MEMORY_UTILIZATION=0.80\n#\n# Context and concurrency share one KV pool. The conservative 1M-token lane\n# keeps 6 active sequence slots for long-context agent ash-dspark\n# Bind to 0.0.0.0 when Hermes/OpenClaw or another machine must reach the API.\n# For a head-node-only test, set this back to 127.0.0.1.\nVLLM_HOST=0.0.0.0\n# API listen port. The launcher also accepts a temporary --port override.\nVLLM_PORT=8000\n# Explicit per-node host IPs prevent distributed vLLM/ZeroMQ from binding the\n# worker to the head node's fabric address. Set these to each node's RoCE IP.\nVLLM_HOST_IP=169.254.240.100\nWORKER_VLLM_HOST_IP=169.254.16.74\n\n# Prebuilt Anemll DSpark vLLM GX10 image (https://github.com/Anemll/dspark-vllm-gx10).\n# Digest-pinned manifest (immutable). Same bytes as the bare tag today; re-tagging\n# cannot silently change what you run. Bump deliberately:\n#   1) docker pull ghcr.io/anemll/dspark-vllm-gx10:0.1.1\n#   2) get its manifest digest (docker inspect --format '{{index .RepoDigests 0}}')\n#   3) update the @sha256: below.\nDSPARK_VLLM_IMAGE=ghcr.io/anemll/dspark-vllm-gx10:0.1.1@sha256:a83948492cf13df455170fb42885f5ef4db54fefe0feff0f841ecbff464ac9d8\n# Alternative: build locally with ./build-dspark-vllm-runtime.sh \u2192 vllm-dspark-runtime:dspark-nvfp4-stage-c\n# and merge docker-compose.stage-c.override.yml (see docs/ENVS.md).\n\n# Serving profile. DSpark k must be >= checkpoint dspark_block_size (5);\n# k<5 truncates draft blocks (silent on Anemll 0.25.2, rejected on stock 0.26+).\n# Capture size = MAX_NUM_SEQS * (MTP_NUM_TOKENS + 1); at k=5 / seqs=6 that is 36 \u2014\n# if graph capture OOMs, lower GPU_MEMORY_UTILIZATION_TEXT / _VISION toward ~0.78.\nMAX_MODEL_LEN=262144\nMAX_NUM_SEQS=10\nMAX_NUM_BATCHED_TOKENS=16384\n# Main GPU util is chosen by ENABLE_VL_SIDECAR (see Experimental: Vision in README).\n# Do not set GPU_MEMORY_UTILIZATION here \u2014 start-deepseek-v4-flash-dspark.sh\n# exports it from these two profiles:\n#   ENABLE_VL_SIDECAR=0 \u2192 GPU_MEMORY_UTILIZATION_TEXT   (larger KV)\n#   ENABLE_VL_SIDECAR=1 \u2192 GPU_MEMORY_UTILIZATION_VISION (room for VL)\nGPU_MEMORY_UTILIZATION_TEXT=0.835\nGPU_MEMORY_UTILIZATION_VISION=0.80\nMTP_NUM_TOKENS=5\n# Default reasoning mode: off, low, high, or max. \"max\" enables full\n# thinking/reasoning effort by default; request-level overrides still win.\nDEFAULT_THINKING=off\n\n# Issue #22 hotfix: automatically patches nvfp4_ds_mla long-context decode\n# regression on every start.  Set to 1 to skip (e.g. if you've already\n# applied the hotfix manually or are using a patched image).\n# DSPARK_SKIP_HOTFIX=0\n\n# No sampling override. The launcher keeps --generation-config vllm only.\n# Explicit client request parameters still win.\n\n# Higher-throughput short-context profile from the Keys concurrency patch:\n# MAX_MODEL_LEN=200000\n# MAX_NUM_SEQS=16\n#\n# Conservative prior agent lane:\n# MAX_MODEL_LEN=1048576\n# MAX_NUM_SEQS=6\n# GPU_MEMORY_UTILIZATION=0.80\n#\n# Context and concurrency share one KV pool. The conservative 1M-token lane\n# keeps 6 active sequence slots for long-context agent traffic.\n# Normal agent turns are much shorter than the maximum; multiple simultaneous\n# full-context requests may still queue depending on the live KV pool.\n\n# ---------------------------------------------------------------------------\n# Anemll 0.1.1-safe vLLM / runtime knobs (default compose injects these)\n# ---------------------------------------------------------------------------\nVLLM_USE_FLASHINFER_SAMPLER=1\nVLLM_USE_BREAKABLE_CUDAGRAPH=0\nVLLM_USE_B12X_MOE=1\nVLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM=0\nVLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M=16\nVLLM_B12X_W4A16_FORCE_TILE_CONFIG=\n\nVLLM_ALLOW_LONG_MAX_MODEL_LEN=1\nVLLM_SPARSE_INDEXER_MAX_LOGITS_MB=256\nVLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=0\n\n# CuTeDSL / b12x compile target for GB10 (not a VLLM_* registry key).\nCUTE_DSL_ARCH=sm_121a\nTORCH_CUDA_ARCH_LIST=12.1a\nFLASHINFER_CUDA_ARCH_LIST=12.1a\nFLASHINFER_DISABLE_VERSION_CHECK=1\nTILELANG_CLEANUP_TEMP_FILES=1\nDG_JIT_USE_NVRTC=0\nDG_JIT_NVCC_COMPILER=/usr/local/cuda/bin/nvcc\nNCCL_NET=IB\nNCCL_IB_DISABLE=0\nNCCL_CUMEM_ENABLE=0\nNCCL_IGNORE_CPU_AFFINITY=1\nNCCL_DEBUG=WARN\nNCCL_NVLS_ENABLE=0\nPYTORCH_CUDA_ALLOC_CONF=expandable_segments:True\n\n# ---------------------------------------------------------------------------\n# Stage-C overlay only \u2014 DO NOT enable on Anemll 0.1.1\n# Uncomment when DSPARK_VLLM_IMAGE is the Stage-C build AND you merge\n# docker-compose.stage-c.override.yml. On Anemll these VLLM_* keys warn:\n#   \"Unknown vLLM environment variable detected: \u2026\"\n# and are ignored. Full matrix: docs/ENVS.md\n# ---------------------------------------------------------------------------\n# VLLM_USE_B12X_WO_PROJECTION=1\n# VLLM_DSPARK_CONFIDENCE_THRESHOLD=0.0\n# VLLM_DSPARK_CONFIDENCE_SCHEDULER=off\n# VLLM_DSPARK_LOCAL_ARGMAX=1\n# VLLM_DSPARK_REPLICATE_MARKOV_W1=1\n# VLLM_DSPARK_FUSED_MARKOV_ARGMAX=0\n# VLLM_DSPARK_GPU_REJECTED_CONTEXT_MASK=1\n# VLLM_DSPARK_REFERENCE_KV_QUANT_DEQUANT=0\n# DSPARK_SLOT_CLAMP=1\n# VLLM_DSPARK_HARDWARE_SCHEDULER_EARLY_STOP=1\n# B12X_W4A16_TC_DECODE=0\n# VLLM_DSV4_B12X_COMPRESSED_MLA=0\n# VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE=0\n# VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE_EXACT=0\n# VLLM_TRITON_MLA_SPARSE=1\n# VLLM_SKIP_INIT_MEMORY_CHECK=1\n\n# ---------------------------------------------------------------------------\n# Vision mode flag (one switch) + VL sidecar + MCP harness install\n# ---------------------------------------------------------------------------\n# ENABLE_VL_SIDECAR=1 \u2192 start Qwen3-VL TP=2 on :8889 + MCP install, and set\n#   0731 util from GPU_MEMORY_UTILIZATION_VISION (default 0.80).\n# ENABLE_VL_SIDECAR=0 \u2192 text-only 0731, util from GPU_MEMORY_UTILIZATION_TEXT\n#   (default 0.835) for a larger KV pool.\n# Flip the flag, then ./stop-\u2026 && ./start-\u2026 (full restart required).\n#\n# Measured Available KV (this cluster, Anemll 0.1.1, 2026-08-11):\n#   text (flag=0, util 0.835): main ~18.08 GiB / ~2.49M tokens\n#   vision (flag=1, util 0.80 + VL 0.04): main 13.37 GiB / 1.37M + VL 1.54 GiB / 84k\n# Default: off ( vllm-runtime.sh \u2192 vllm-dspark-runtime:dspark-nvfp4-stage-c\n# and merge docker-compose.stage-c.override.yml (see docs/ENVS.md).\n\n# Serving profile. DSpark k must be >= checkpoint dspark_block_size (5);\n# k<5 truncates draft blocks (silent on Anemll 0.25.2, rejected on stock 0.26+).\n# Capture size = MAX_NUM_SEQS * (MTP_NUM_TOKENS + 1); at k=5 / seqs=6 that is 36 \u2014\n# if graph capture OOMs, lower GPU_MEMORY_UTILIZATION_TEXT / _VISION toward ~0.78.\nMAX_MODEL_LEN=262144\nMAX_NUM_SEQS=10\nMAX_NUM_BATCHED_TOKENS=16384\n# Main GPU util is chosen by ENABLE_VL_SIDECAR (see Experimental: Vision in README).\n# Do not set GPU_MEMORY_UTILIZATION here \u2014 start-deepseek-v4-flash-dspark.sh\n# exports it from these two profiles:\n#   ENABLE_VL_SIDECAR=0 \u2192 GPU_MEMORY_UTILIZATION_TEXT   (larger KV)\n#   ENABLE_VL_SIDECAR=1 \u2192 GPU_MEMORY_UTILIZATION_VISION (room for VL)\nGPU_MEMORY_UTILIZATION_TEXT=0.835\nGPU_MEMORY_UTILIZATION_VISION=0.80\nMTP_NUM_TOKENS=5\n# Default reasoning mode: off, low, high, or max. \"max\" enables full\n# thinking/reasoning effort by default; request-level overrides still win.\nDEFAULT_THINKING=off\n\n# Issue #22 hotfix: automatically patches nvfp4_ds_mla long-context decode\n# regression on every start.  Set to 1 to skip (e.g. if you've already\n# applied the hotfix manually or are using a patched image).\n# DSPARK_SKIP_HOTFIX=0\n\n# No sampling override. The launcher keeps --generation-config vllm only.\n# Explicit client request parameters still win.\n\n# Higher-throughput short-context profile from the Keys concurrency patch:\n# MAX_MODEL_LEN=200000\n# MAX_NUM_SEQS=16\n#\n# Conservative prior agent lane:\n# MAX_MODEL_LEN=1048576\n# MAX_NUM_SEQS=6\n# GPU_MEMORY_UTILIZATION=0.80\n#\n# Context and concurrency share one KV pool. The conservative 1M-token lane\n# keeps 6 active sequence slots for long-context agent traffic.\n# Normal agent turns are much shorter than the maximum; multiple simultaneous\n# full-context requests may still queue depending on the live KV pool.\n\n# ---------------------------------------------------------------------------\n# Anemll 0.1.1-safe vLLM / runtime knobs (default compose injects these)\n# ---------------------------------------------------------------------------\nVLLM_USE_FLASHINFER_SAMPLER=1\nVLLM_USE_BREAKABLE_CUDAGRAPH=0\nVLLM_USE_B12X_MOE=1\nVLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM=0\nVLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M=64\nVLLM_B12X_W4A16_FORCE_TILE_CONFIG=\n\nVLLM_ALLOW_LONG_MAX_MODEL_LEN=1\nVLLM_SPARSE_INDEXER_MAX_LOGITS_MB=256\nVLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=0\n\n# CuTeDSL / b12x compile target for GB10 (not a VLLM_* registry key).\nCUTE_DSL_ARCH=sm_121a\nTORCH_CUDA_ARCH_LIST=12.1a\nFLASHINFER_CUDA_ARCH_LIST=12.1a\nFLASHINFER_DISABLE_VERSION_CHECK=1\nTILELANG_CLEANUP_TEMP_FILES=1\nDG_JIT_USE_NVRTC=0\nDG_JIT_NVCC_COMPILER=/usr/local/cuda/bin/nvcc\nNCCL_NET=IB\nNCCL_IB_DISABLE=0\nNCCL_CUMEM_ENABLE=0\nNCCL_IGNORE_CPU_AFFINITY=1\nNCCL_DEBUG=WARN\nNCCL_NVLS_ENABLE=0\nPYTORCH_CUDA_ALLOC_CONF=expandable_segments:True\n\n# ---------------------------------------------------------------------------\n# Stage-C overlay only \u2014 DO NOT enable on Anemll 0.1.1\n# Uncomment when DSPARK_VLLM_IMAGE is the Stage-C build AND you merge\n# docker-compose.stage-c.override.yml. On Anemll these VLLM_* keys warn:\n#   \"Unknown vLLM environment variable detected: \u2026\"\n# and are ignored. Full matrix: docs/ENVS.md\n# ---------------------------------------------------------------------------\n# VLLM_USE_B12X_WO_PROJECTION=1\n# VLLM_DSPARK_CONFIDENCE_THRESHOLD=0.0\n# VLLM_DSPARK_CONFIDENCE_SCHEDULER=off\n# VLLM_DSPARK_LOCAL_ARGMAX=1\n# VLLM_DSPARK_REPLICATE_MARKOV_W1=1\n# VLLM_DSPARK_FUSED_MARKOV_ARGMAX=0\n# VLLM_DSPARK_GPU_REJECTED_CONTEXT_MASK=1\n# VLLM_DSPARK_REFERENCE_KV_QUANT_DEQUANT=0\n# DSPARK_SLOT_CLAMP=1\n# VLLM_DSPARK_HARDWARE_SCHEDULER_EARLY_STOP=1\n# B12X_W4A16_TC_DECODE=0\n# VLLM_DSV4_B12X_COMPRESSED_MLA=0\n# VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE=0\n# VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE_EXACT=0\n# VLLM_TRITON_MLA_SPARSE=1\n# VLLM_SKIP_INIT_MEMORY_CHECK=1\n\n# ---------------------------------------------------------------------------\n# Vision mode flag (one switch) + VL sidecar + MCP harness install\n# ---------------------------------------------------------------------------\n# ENABLE_VL_SIDECAR=1 \u2192 start Qwen3-VL TP=2 on :8889 + MCP install, and set\n#   0731 util from GPU_MEMORY_UTILIZATION_VISION (default 0.80).\n# ENABLE_VL_SIDECAR=0 \u2192 text-only 0731, util from GPU_MEMORY_UTILIZATION_TEXT\n#   (default 0.835) for a larger KV pool.\n# Flip the flag, then ./stop-\u2026 && ./start-\u2026 (full restart required).\n#\n# Measured Available KV (this cluster, Anemll 0.1.1, 2026-08-11):\n#   text (flag=0, util 0.835): main ~18.08 GiB / ~2.49M tokens\n#   vision (flag=1, util 0.80 + VL 0.04): main 13.37 GiB / 1.37M + VL 1.54 GiB / 84k\n# Default: off (text-only, larger main KV). Vision/VL coexist is deferred to a\n# follow-up PR \u2014 leave knobs commented; they are unused while the flag is 0.\nENABLE_VL_SIDECAR=0\n# Do not download VL weights on text-only prepare (set 1 only for a vision PR).\nPREPARE_VL_SIDECAR_MODEL=0\n# VL_SIDECAR_MODEL=cyankiwi/Qwen3-VL-4B-Instruct-AWQ-4bit\n# VL_SIDECAR_SERVED_NAME=qwen3-vl-4b\n# VL_SIDECAR_PORT=8889\n# VL_SIDECAR_TP_SIZE=2\n# VL_SIDECAR_NNODES=2\n# VL_SIDECAR_MASTER_PORT=25100\n# VL_SIDECAR_GPU_UTIL=0.04\n# VL_SIDECAR_MAX_NUM_SEQS=4\n# VL_SIDECAR_MAX_MODEL_LEN=32768\n# VL_SIDECAR_KV_CACHE_DTYPE=int4_per_token_head\n# VL_SIDECAR_ATTENTION_BACKEND=TRITON_ATTN\n# Optional: VL_SIDECAR_KV_CACHE_MEMORY_BYTES=367001600\n# VL weights: ./prepare-dspark-model-cache.sh downloads VL_SIDECAR_MODEL on\n# head and worker when PREPARE_VL_SIDECAR_MODEL=1 (TP=2 needs both caches).\n# After sidecar is healthy, start can register MCP into detected harnesses\n# only when ENABLE_VL_SIDECAR=1 (installer also no-ops if the flag is off).\n# INSTALL_VISION_MCP=0 skips harness registration even when vision is on.\n# INSTALL_VISION_MCP=1\n# VISION_MCP_HARNESSES=auto\n# VISION_MCP_HARNESSES=pi,omp,hermes,opencode,goose,grok,openclaw,zcode,prime,factory,commandcode\n\n# --- local: hold issue #26 hybrid prefix-cache hotfix (issue #39 tool-name regression,\n# bisected to #26 by siraustin; v2 fix on 103af68c is unvalidated). Remove both lines to A/B.\nDSPARK_ISSUE26_HOTFIX=/home/nvidia/dspark-mia/patches/noop.py\nVLLM_PREFIX_CACHE_RETENTION_INTERVAL=\n\n# --- local: undo the #27 prefill serialization. Measured 2026-08-14 on our box:\n# cap=1 + 1024-token chunks moved 18K-prompt work from prefill into queue\n# (q 0.02s -> 6.68s at c=10), costing 24% on score vs cbd719f. PR #44 decode\n# floor stays on and covers the per-step starvation #27 targeted.\nDSPARK_ISSUE27_HOTFIX=/home/nvidia/dspark-mia/patches/noop.py\nLONG_PREFILL_TOKEN_THRESHOLD=0\nENABLE_VLLM_GB10_PATCH=0", "hotfixes": {"10.150.0.50": ["issue43-hotfix", "issue55-hotfix"], "10.150.0.51": ["issue43-hotfix", "issue55-hotfix"]}, "deployment": "compose", "config_file": "env.dspark", "workload": null, "gates": {"smoke": true, "toolprobe": true, "loadgen": true, "decode_shapes": null}, "metrics": {"n": 2, "score": 95.75487225849093, "ttft_p95": 7.1625771895051, "tps_req": 25.03293901379749, "tps_agg": 76.74355330350375, "spread": 2.4390625396912964, "preempt": 0.0, "cache": 83.81332889406804, "queue": 1.4156871475279332e-05, "prefill": 4.822650995943695}, "levels": [{"c": 1, "n": 2, "score": 35.89840796055648, "ttft_p50": 1.4625093304784968, "ttft_p95": 1.4625093304784968, "total_p95": 7.190160766011104, "tps_req": 52.47349323602876, "tps_agg": 41.841452270424554, "tpot": 0.019156024868002032, "out": 300.0, "prompt": 18021.0, "queue": 1.6767880879342556e-05, "prefill": 1.4178022999549285, "cache": 83.81332889406804, "preempt": 0.0, "ok": "2/2"}, {"c": 5, "n": 2, "score": 95.73393633530617, "ttft_p50": 7.160191764472984, "ttft_p95": 7.1625771895051, "total_p95": 19.533161108382046, "tps_req": 25.0329 ompose (shared/scp'd .env is fine). Do not rely on WORKER_* first in\n# docker-compose \u2014 that substitution is not rank-aware.\n# WORKER_NCCL_IB_HCA=rocep1s0f0\n# WORKER_NCCL_SOCKET_IFNAME=enp1s0f0np0\n# WORKER_TP_SOCKET_IFNAME=enp1s0f0np0\n# WORKER_GLOO_SOCKET_IFNAME=enp1s0f0np0\n# RoCEv2 GID index: start-*.sh resolves per node from sysfs by default\n# (NCCL_IB_GID_AUTO=1). Index differs per node/HCA and drifts after reboot;\n# a single shared literal on both ranks can wedge NCCL at init.\n# Pin only when you disable auto:\n# NCCL_IB_GID_AUTO=0\n# NCCL_IB_GID_INDEX=3\n# WORKER_NCCL_IB_GID_INDEX=6\n# Optional match IPs if the RoCE address is not the ifname primary IPv4:\n# NCCL_IB_GID_MATCH_IP=10.0.22.1\n# WORKER_NCCL_IB_GID_MATCH_IP=10.0.22.2\nNCCL_CROSS_NIC=1\n\n# Caches / model\nHF_CACHE=${HOME}/.cache/huggingface\n# Optional worker-local Hugging Face cache. Use this when the worker user/path\n# differs from the head node. If blank, the worker uses HF_CACHE.\nWORKER_HF_CACHE=\n# Prefer offline when both nodes already have a full hub cache (online re-download can fill worker disks).\nHF_HUB_OFFLINE=1\nTRANSFORMERS_OFFLINE=1\nHF_HUB_DISABLE_XET=1\n# Checkpoint flag: 0 = official 0731, 1 = abliterated (Keys).\n# start- / prepare- resolve DSPARK_MODEL from this \u2014 do not set DSPARK_MODEL by hand.\nABLITERATED=0\nDSPARK_MODEL_OFFICIAL=deepseek-ai/DeepSeek-V4-Flash-0731\nDSPARK_MODEL_ABLITERATED=drowzeys/keys-DeepSeekV4-Flash-GA-0731-Dspark-Abliterated-32-32\n# Pin official HF revision (issue #19). Default when unset: tested 9e165c30\u2026\n# Set DSPARK_REVISION= (empty) to follow tip of main. Abliterated uses\n# DSPARK_REVISION_ABLITERATED (empty = tip of that repo).\nDSPARK_REVISION=7872f01b1d1fe23eabc4c98b48bffcef5a386062\n# DSPARK_REVISION_ABLITERATED=\n# Optional pin for the 0731 encoder inside the container. Leave empty to auto-find\n# encoding/encoding_dsv4.py under the selected model's HF hub snapshot (prefers\n# DSPARK_REVISION when set).\nDSPARK_ENCOD heckout path. This is useful when the worker clone\n# lives somewhere different from the head checkout; it takes precedence over\n# WORKER_DIR when set.\nWORKER_SCRIPT_DIR=\nMASTER_ADDR=169.254.240.100\nMASTER_PORT=25000\nNODE_RANK=0\nHEADLESS=\n\n# Worker node should use:\n# NODE_RANK=1\n# HEADLESS=1\n\n# RoCE / InfiniBand (head node). On a QSFP ring, the worker's facing port\n# name often differs \u2014 set WORKER_NCCL_* below; start-*.sh passes them remotely.\nNCCL_IB_HCA=rocep1s0f1\nNCCL_SOCKET_IFNAME=enp1s0f1np1\nTP_SOCKET_IFNAME=enp1s0f1np1\nGLOO_SOCKET_IFNAME=enp1s0f1np1\n# Optional worker overrides (defaults to the head values if unset).\n# Set these on the HEAD .env; start-deepseek-v4-flash-dspark.sh injects them on\n# remote compose (shared/scp'd .env is fine). Do not rely on WORKER_* first in\n# docker-compose \u2014 that substitution is not rank-aware.\n# WORKER_NCCL_IB_HCA=rocep1s0f0\n# WORKER_NCCL_SOCKET_IFNAME=enp1s0f0np0\n# WORKER_TP_SOCKET_IFNAME=enp1s0f0np0\n# WORKER_GLOO_SOCKET_IFNAME=enp1s0f0np0\n# RoCEv2 GID index: start-*.sh resolves per node from sysfs by default\n# (NCCL_IB_GID_AUTO=1). Index differs per node/HCA and drifts after reboot;\n# a single shared literal on both ranks can wedge NCCL at init.\n# Pin only when you disable auto:\n# NCCL_IB_GID_AUTO=0\n# NCCL_IB_GID_INDEX=3\n# WORKER_NCCL_IB_GID_INDEX=6\n# Optional match IPs if the RoCE address is not the ifname primary IPv4:\n# NCCL_IB_GID_MATCH_IP=10.0.22.1\n# WORKER_NCCL_IB_GID_MATCH_IP=10.0.22.2\nNCCL_CROSS_NIC=1\n\n# Caches / model\nHF_CACHE=${HOME}/.cache/huggingface\n# Optional worker-local Hugging Face cache. Use this when the worker user/path\n# differs from the head node. If blank, the worker uses HF_CACHE.\nWORKER_HF_CACHE=\n# Prefer offline when both nodes already have a full hub cache (online re-download can fill worker disks).\nHF_HUB_OFFLINE=1\nTRANSFORMERS_OFFLINE=1\nHF_HUB_DISABLE_XET=1\n# Checkpoint flag: 0 = official 0731, 1 = abliterated (Keys).\n# start- / prepare- resolve DSPARK_MODEL from this \u2014 do not set DSPARK_MODEL by hand.\nABLITERATED=0\nDSPARK_MODEL_OFFICIAL=deepseek-ai/DeepSeek-V4-Flash-0731\nDSPARK_MODEL_ABLITERATED=drowzeys/keys-DeepSeekV4-Flash-GA-0731-Dspark-Abliterated-32-32\n# Pin official HF revision (issue #19). Default when unset: tested 9e165c30\u2026\n# Set DSPARK_REVISION= (empty) to follow tip of main. Abliterated uses\n# DSPARK_REVISION_ABLITERATED (empty = tip of that repo).\nDSPARK_REVISION=7872f01b1d1fe23eabc4c98b48bffcef5a386062\n# DSPARK_REVISION_ABLITERATED=\n# Optional pin for the 0731 encoder inside the container. Leave empty to auto-find\n# encoding/encoding_dsv4.py under the selected model's HF hub snapshot (prefers\n# DSPARK_REVISION when set).\nDSPARK_ENCODING_FILE=\nSERVED_MODEL_NAME=deepseek-v4-flash-dspark\n# Bind to 0.0.0.0 when Hermes/OpenClaw or another machine must reach the API.\n# For a head-node-only test, set this back to 127.0.0.1.\nVLLM_HOST=0.0.0.0\n# API listen port. The launcher also accepts a temporary --port override.\nVLLM_PORT=8000\n# Explicit per-node host IPs prevent distributed vLLM/ZeroMQ from binding the\n# worker to the head node's fabric address. Set these to each node's RoCE IP.\nVLLM_HOST_IP=169.254.240.100\nWORKER_VLLM_HOST_IP=169.254.16.74\n\n# Prebuilt Anemll DSpark vLLM GX10 image (https://github.com/Anemll/dspark-vllm-gx10).\n# Digest-pinned manifest (immutable). Same bytes as the bare tag today; re-tagging\n# cannot silently change what you run. Bump deliberately:\n#   1) docker pull ghcr.io/anemll/dspark-vllm-gx10:0.1.1\n#   2) get its manifest digest (docker inspect --format '{{index .RepoDigests 0}}')\n#   3) update the @sha256: below.\nDSPARK_VLLM_IMAGE=ghcr.io/anemll/dspark-vllm-gx10:0.1.1@sha256:a83948492cf13df455170fb42885f5ef4db54fefe0feff0f841ecbff464ac9d8\n# Alternative: build locally with ./build-dspark-vllm-runtime.sh \u2192 vllm-dspark-runtime:dspark-nvfp4-stage-c\n# and merge docker-compose.stage-c.override.yml (see docs/ENVS.md).\n\n# Serving profile. DSpark k must be >= checkpoint dspark_block_size (5);\n# k<5 truncates draft blocks (silent on Anemll 0.25.2, rejected on stock 0.26+).\n# Capture size = MAX_NUM_SEQS * (MTP_NUM_TOKENS + 1); at k=5 / seqs=6 that is 36 \u2014\n# if graph capture OOMs, lower GPU_MEMORY_UTILIZATION_TEXT / _VISION toward ~0.78.\nMAX_MODEL_LEN=262144\nMAX_NUM_SEQS=10\nMAX_NUM_BATCHED_TOKENS=16384\n# Main GPU util is chosen by ENABLE_VL_SIDECAR (see Experimental: Vision in README).\n# Do not set GPU_MEMORY_UTILIZATION here \u2014 start-deepseek-v4-flash-dspark.sh\n# exports it from these two profiles:\n#   ENABLE_VL_SIDECAR=0 \u2192 GPU_MEMORY_UTILIZATION_TEXT   (larger KV)\n#   ENABLE_VL_SIDECAR=1 \u2192 GPU_MEMORY_UTILIZATION_VISION (room for VL)\nGPU_MEMORY_UTILIZATION_TEXT=0.835\nGPU_MEMORY_UTILIZATION_VISION=0.80\nMTP_NUM_TOKENS=7\n# Default reasoning mode: off, low, high, or max. \"max\" enables full\n# thinking/reasoning effort by default; request-level overrides still win.\nDEFAULT_THINKING=off\n\n# Issue #22 hotfix: automatically patches nvfp4_ds_mla long-context decode\n# regression on every start.  Set to 1 to skip (e.g. if you've already\n# applied the hotfix manually or are using a patched image).\n# DSPARK_SKIP_HOTFIX=0\n\n# No sampling override. The launcher keeps --generation-config vllm only.\n# Explicit client request parameters still win.\n\n# Higher-throughput short-context profile from the Keys concurrency patch:\n# MAX_MODEL_LEN=200000\n# MAX_NUM_SEQS=16\n#\n# Conservative prior agent lane:\n# MAX_MODEL_LEN=1048576\n# MAX_NUM_SEQS=6\n# GPU_MEMORY_UTILIZATION=0.80\n#\n# Context and concurrency share one KV pool. The conservative 1M-token lane\n# keeps 6 active sequence slots for long-context agent traffic.\n# Normal agent turns are much shorter than the maximum; multiple simultaneous\n# full-context requests may still queue depending on the live KV pool.\n\n# ---------------------------------------------------------------------------\n# Anemll 0.1.1-saf neration-config": "vllm", "--override-generation-config": "'{\"top_p\":0.95}'", "--enable-flashinfer-autotune": true, "--nnodes": "2", "--node-rank": "0", "--master-addr": "169.254.240.100", "--master-port": "25000"}, "env_text": "# DeepSeek V4 Flash DSpark C12 NVFP4 profile for 2x DGX Spark TP=2.\n# Copy to .env.dspark on each node and adjust node-specific values.\n#\n# Env matrix (Anemll 0.1.1 vs Stage-C overlay): see docs/ENVS.md\n# Default image is Anemll \u2014 keep Stage-C-only VLLM_* keys commented unless\n# you build/run the Stage-C image and merge docker-compose.stage-c.override.yml.\n\n# Cluster\nWORKER_HOST=10.150.0.51\n# Worker-local checkout/deployment path. Leave blank to mirror the head path.\nWORKER_DIR=\n# Optional explicit worker checkout path. This is useful when the worker clone\n# lives somewhere different from the head checkout; it takes precedence over\n# WORKER_DIR when set.\nWORKER_SCRIPT_DIR=\nMASTER_ADDR=169.254.240.100\nMASTER_PORT=25000\nNODE_RANK=0\nHEADLESS=\n\n# Worker node should use:\n# NODE_RANK=1\n# HEADLESS=1\n\n# RoCE / InfiniBand (head node). On a QSFP ring, the worker's facing port\n# name often differs \u2014 set WORKER_NCCL_* below; start-*.sh passes them remotely.\nNCCL_IB_HCA=rocep1s0f1\nNCCL_SOCKET_IFNAME=enp1s0f1np1\nTP_SOCKET_IFNAME=enp1s0f1np1\nGLOO_SOCKET_IFNAME=enp1s0f1np1\n# Optional worker overrides (defaults to the head values if unset).\n# Set these on the HEAD .env; start-deepseek-v4-flash-dspark.sh injects them on\n# remote compose (shared/scp'd .env is fine). Do not rely on WORKER_* first in\n# docker-compose \u2014 that substitution is not rank-aware.\n# WORKER_NCCL_IB_HCA=rocep1s0f0\n# WORKER_NCCL_SOCKET_IFNAME=enp1s0f0np0\n# WORKER_TP_SOCKET_IFNAME=enp1s0f0np0\n# WORKER_GLOO_SOCKET_IFNAME=enp1s0f0np0\n# RoCEv2 GID index: start-*.sh resolves per node from sysfs by default\n# (NCCL_IB_GID_AUTO=1). Index differs per node/HCA and drifts after reboot;\n# a single shared literal on both ranks can wedge NCCL at init.\n# Pin only when you disable auto:\n# NCCL_IB_GID_AUTO=0\n# NCCL_IB_GID_INDEX=3\n# WORKER_NCCL_IB_GID_INDEX=6\n# Optional match IPs if the RoCE address is not the ifname primary IPv4:\n# NCCL_IB_GID_MATCH_IP=10.0.22.1\n# WORKER_NCCL_IB_GID_MATCH_IP=10.0.22.2\nNCCL_CROSS_NIC=1\n\n# Caches / model\nHF_CACHE=${HOME}/.cache/huggingface\n# Optional worker-local Hugging Face cache. Use this when the worker user/path\n# differs from the head node. If blank, the worker uses HF_CACHE.\nWORKER_HF_CACHE=\n# Prefer offline when both nodes already have a full hub cache (online re-download can fill worker disks).\nHF_HUB_OFFLINE=1\nTRANSFORMERS_OFFLINE=1\nHF_HUB_DISABLE_XET=1\n# Checkpoint flag: 0 = official 0731, 1 = abliterated (Keys).\n# start- / prepare- resolve DSPARK_MODEL from this \u2014 do not set DSPARK_MODEL by hand.\nABLITERATED=0\nDSPARK_MODEL_OFFICIAL=deepseek-ai/DeepSeek-V4-Flash-0731\nDSPARK_MODEL_ABLITERATED=drowzeys/keys-DeepSeekV4-Flash-GA-0731-Dspark-Abliterated-32-32\n# Pin official HF revision (issue #19). Default when unset: tested 9e165c30\u2026\n# Set DSPARK_REVISION= (empty) to follow tip of main. Abliterated uses\n# DSPARK_REVISION_ABLITERATED (empty = tip of that repo).\nDSPARK_REVISION=7872f01b1d1fe23eabc4c98b48bffcef5a386062\n# DSPARK_REVISION_ABLITERATED=\n# Optional pin for the 0731 encoder inside the container. Leave empty to auto-find\n# encoding/encoding_dsv4.py under the selected model's HF hub snapshot (prefers\n# DSPARK_REVISION when set).\nDSPARK_ENCODING_FILE=\nSERVED_MODEL_NAME=deepseek-v4-flash-dspark\n# Bind to 0.0.0.0 when Hermes/OpenClaw or another machine must reach the API.\n# For a head-node-only test, set this back to 127.0.0.1.\nVLLM_HOST=0.0.0.0\n# API listen port. The launcher also accepts a temporary --port override.\nVLLM_PORT=8000\n# Explicit per-node host IPs prevent distributed vLLM/ZeroMQ from binding the\n# worker to the head node's fabric address. Set these to each node's RoCE IP.\nVLLM_HOST_IP=169.254.240.100\nWORKE IX=0\n\n# No sampling override. The launcher keeps --generation-config vllm only.\n# Explicit client request parameters still win.\n\n# Higher-throughput short-context profile from the Keys concurrency patch:\n# MAX_MODEL_LEN=200000\n# MAX_NUM_SEQS=16\n#\n# Conservative prior agent lane:\n# MAX_MODEL_LEN=1048576\n# MAX_NUM_SEQS=6\n# GPU_MEMORY_UTILIZATION=0.80\n#\n# Context and concurrency share one KV pool. The conservative 1M-token lane\n# keeps 6 active sequence slots for long-context agent traffic.\n# Normal agent turns are much shorter than the maximum; multiple simultaneous\n# full-context requests may still queue depending on the live KV pool.\n\n# ---------------------------------------------------------------------------\n# Anemll 0.1.1-safe vLLM / runtime knobs (default compose injects these)\n# ---------------------------------------------------------------------------\nVLLM_USE_FLASHINFER_SAMPLER=1\nVLLM_USE_BREAKABLE_CUDAGRAPH=0\nVLLM_USE_B12X_MOE=1\nVLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM=0\nVLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M=64\nVLLM_B12X_W4A16_FORCE_TILE_CONFIG=\n\nVLLM_ALLOW_LONG_MAX_MODEL_LEN=1\nVLLM_SPARSE_INDEXER_MAX_LOGITS_MB=256\nVLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=0\n\n# CuTeDSL / b12x compile target for GB10 (not a VLLM_* registry key).\nCUTE_DSL_ARCH=sm_121a\nTORCH_CUDA_ARCH_LIST=12.1a\nFLASHINFER_CUDA_ARCH_LIST=12.1a\nFLASHINFER_DISABLE_VERSION_CHECK=1\nTILELANG_CLEANUP_TEMP_FILES=1\nDG_JIT_USE_NVRTC=0\nDG_JIT_NVCC_COMPILER=/usr/local/cuda/bin/nvcc\nNCCL_NET=IB\nNCCL_IB_DISABLE=0\nNCCL_CUMEM_ENABLE=0\nNCCL_IGNORE_CPU_AFFINITY=1\nNCCL_DEBUG=WARN\nNCCL_NVLS_ENABLE=0\nPYTORCH_CUDA_ALLOC_CONF=expandable_segments:True\n\n# ---------------------------------------------------------------------------\n# Stage-C overlay only \u2014 DO NOT enable on Anemll 0.1.1\n# Uncomment when DSPARK_VLLM_IMAGE is the Stage-C build AND you merge\n# docker-compose.stage-c.override.yml. On Anemll these VLLM_* keys warn:\n#   \"Unknown vLLM environment variable dete 1\nNCCL_SOCKET_IFNAME=enp1s0f1np1\nTP_SOCKET_IFNAME=enp1s0f1np1\nGLOO_SOCKET_IFNAME=enp1s0f1np1\n# Optional worker overrides (defaults to the head values if unset).\n# Set these on the HEAD .env; start-deepseek-v4-flash-dspark.sh injects them on\n# remote compose (shared/scp'd .env is fine). Do not rely on WORKER_* first in\n# docker-compose \u2014 that substitution is not rank-aware.\n# WORKER_NCCL_IB_HCA=rocep1s0f0\n# WORKER_NCCL_SOCKET_IFNAME=enp1s0f0np0\n# WORKER_TP_SOCKET_IFNAME=enp1s0f0np0\n# WORKER_GLOO_SOCKET_IFNAME=enp1s0f0np0\n# RoCEv2 GID index: start-*.sh resolves per node from sysfs by default\n# (NCCL_IB_GID_AUTO=1). Index differs per node/HCA and drifts after reboot;\n# a single shared literal on both ranks can wedge NCCL at init.\n# Pin only when you disable auto:\n# NCCL_IB_GID_AUTO=0\n# NCCL_IB_GID_INDEX=3\n# WORKER_NCCL_IB_GID_INDEX=6\n# Optional match IPs if the RoCE address is not the ifname primary IPv4:\n# NCCL_IB_GID_MATCH_IP=10.0.22.1\n# WORKER_NCCL_IB_GID_MATCH_IP=10.0.22.2\nNCCL_CROSS_NIC=1\n\n# Caches / model\nHF_CACHE=${HOME}/.cache/huggingface\n# Optional worker-local Hugging Face cache. Use this when the worker user/path\n# differs from the head node. If blank, the worker uses HF_CACHE.\nWORKER_HF_CACHE=\n# Prefer offline when both nodes already have a full hub cache (online re-download can fill worker disks).\nHF_HUB_OFFLINE=1\nTRANSFORMERS_OFFLINE=1\nHF_HUB_DISABLE_XET=1\n# Checkpoint flag: 0 = official 0731, 1 = abliterated (Keys).\n# start- / prepare- resolve DSPARK_MODEL from this \u2014 do not set DSPARK_MODEL by hand.\nABLITERATED=0\nDSPARK_MODEL_OFFICIAL=deepseek-ai/DeepSeek-V4-Flash-0731\nDSPARK_MODEL_ABLITERATED=drowzeys/keys-DeepSeekV4-Flash-GA-0731-Dspark-Abliterated-32-32\n# Pin official HF revision (issue #19). Default when unset: tested 9e165c30\u2026\n# Set DSPARK_REVISION= (empty) to follow tip of main. Abliterated uses\n# DSPARK_REVISION_ABLITERATED (empty = tip of that repo).\nDSPARK_REVISION=7872f01b1d1fe23eabc4c98b48bffcef5a386062\n# DSPARK_REVISION_ABLITERATED=\n# Optional pin for the 0731 encoder inside the container. Leave empty to auto-find\n# encoding/encoding_dsv4.py under the selected model's HF hub snapshot (prefers\n# DSPARK_REVISION when set).\nDSPARK_ENCODING_FILE=\nSERVED_MODEL_NAME=deepseek-v4-flash-dspark\n# Bind to 0.0.0.0 when Hermes/OpenClaw or another machine must reach the API.\n# For a head-node-only test, set this back to 127.0.0.1.\nVLLM_HOST=0.0.0.0\n# API listen port. The launcher also accepts a temporary --port override.\nVLLM_PORT=8000\n# Explicit per-node host IPs prevent distributed vLLM/ZeroMQ from binding the\n# worker to the head node's fabric address. Set these to each node's RoCE IP.\nVLLM_HOST_IP=169.254.240.100\nWORKER_VLLM_HOST_IP=169.254.16.74\n\n# Prebuilt Anemll DSpark vLLM GX10 image (https://github.com/Anemll/dspark-vllm-gx10).\n# Digest-pinned manifest (immutable). Same bytes as the bare tag today; re-tagging\n# cannot silently change what you run. Bump deliberately:\n#   1) docker pull ghcr.io/anemll/dspark-vllm-gx10:0.1.1\n#   2) get its manifest digest (docker inspect --format '{{index .RepoDigests 0}}')\n#   3) update the @sha256: below.\nDSPARK_VLLM_IMAGE=ghcr.io/anemll/dspark-vllm-gx10:0.1.1@sha256:a83948492cf13df455170fb42885f5ef4db54fefe0feff0f841ecbff464ac9d8\n# Alternative: build locally with ./build-dspark-vllm-runtime.sh \u2192 vllm-dspark-runtime:dspark-nvfp4-stage-c\n# and merge docker-compose.stage-c.override.yml (see docs/ENVS.md).\n\n# Serving profile. DSpark k must be >= checkpoint dspark_block_size (5);\n# k<5 truncates draft blocks (silent on Anemll 0.25.2, rejected on stock 0.26+).\n# Capture size = MAX_NUM_SEQS * (MTP_NUM_TOKENS + 1); at k=5 / seqs=6 that is 36 \u2014\n# if graph capture OOMs, lower GPU_MEMORY_UTILIZATION_TEXT / _VISION toward ~0.78.\nMAX_MODEL_LEN=262144\nMAX_NUM_SEQS=10\nMAX_NUM_BATCHED_TOKENS=16384\n# Main GPU util is chosen by ENABLE_VL_SIDECAR (see Experimental: Vision in README).\n# Do not
