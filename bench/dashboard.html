_* keys commented unless\n# you build/run the Stage-C image and merge docker-compose.stage-c.override.yml.\n\n# Cluster\nWORKER_HOST=10.150.0.51\n# Worker-local checkout/deployment path. Leave blank to mirror the head path.\nWORKER_DIR=\n# Optional explicit worker checkout path. This is useful when the worker clone\n# lives somewhere different from the head checkout; it takes precedence over\n# WORKER_DIR when set.\nWORKER_SCRIPT_DIR=\nMASTER_ADDR=169.254.240.100\nMASTER_PORT=25000\nNODE_RANK=0\nHEADLESS=\n\n# Worker node should use:\n# NODE_RANK=1\n# HEADLESS=1\n\n# RoCE / InfiniBand (head node). On a QSFP ring, the worker's facing port\n# name often differs \u2014 set WORKER_NCCL_* below; start-*.sh passes them remotely.\nNCCL_IB_HCA=rocep1s0f1\nNCCL_SOCKET_IFNAME=enp1s0f1np1\nTP_SOCKET_IFNAME=enp1s0f1np1\nGLOO_SOCKET_IFNAME=enp1s0f1np1\n# Optional worker overrides (defaults to the head values if unset).\n# Set these on the HEAD .env; start-deepseek-v4-flash-dspark.sh injects them on\n# remote compose (shared/scp'd .env is fine). Do not rely on WORKER_* first in\n# docker-compose \u2014 that substitution is not rank-aware.\n# WORKER_NCCL_IB_HCA=rocep1s0f0\n# WORKER_NCCL_SOCKET_IFNAME=enp1s0f0np0\n# WORKER_TP_SOCKET_IFNAME=enp1s0f0np0\n# WORKER_GLOO_SOCKET_IFNAME=enp1s0f0np0\n# RoCEv2 GID index: start-*.sh resolves per node from sysfs by default\n# (NCCL_IB_GID_AUTO=1). Index differs per node/HCA and drifts after reboot;\n# a single shared literal on both ranks can wedge NCCL at init.\n# Pin only when you disable auto:\n# NCCL_IB_GID_AUTO=0\n# NCCL_IB_GID_INDEX=3\n# WORKER_NCCL_IB_GID_INDEX=6\n# Optional match IPs if the RoCE address is not the ifname primary IPv4:\n# NCCL_IB_GID_MATCH_IP=10.0.22.1\n# WORKER_NCCL_IB_GID_MATCH_IP=10.0.22.2\nNCCL_CROSS_NIC=1\n\n# Caches / model\nHF_CACHE=${HOME}/.cache/huggingface\n# Optional worker-local Hugging Face cache. Use this when the worker user/path\n# differs from the head node. If blank, the worker uses HF_CACHE.\nWORKER_HF_CACHE=\n# Prefer offline when both nodes already have a full hub cache (online re-download can fill worker disks).\nHF_HUB_OFFLINE=1\nTRANSFORMERS_OFFLINE=1\nHF_HUB_DISABLE_XET=1\n# Checkpoint flag: 0 = official 0731, 1 = abliterated (Keys).\n# start- / prepare- resolve DSPARK_MODEL from this \u2014 do not set DSPARK_MODEL by hand.\nABLITERATED=0\nDSPARK_MODEL_OFFICIAL=deepseek-ai/DeepSeek-V4-Flash-0731\nDSPARK_MODEL_ABLITERATED=drowzeys/keys-DeepSeekV4-Flash-GA-0731-Dspark-Abliterated-32-32\n# Pin official HF revision (issue #19). Default when unset: tested 9e165c30\u2026\n# Set DSPARK_REVISION= (empty) to follow tip of main. Abliterated uses\n# DSPARK_REVISION_ABLITERATED (empty = tip of that repo).\nDSPARK_REVISION=7872f01b1d1fe23eabc4c98b48bffcef5a386062\n# DSPARK_REVISION_ABLITERATED=\n# Optional pin for the 0731 encoder inside the container. Leave empty to auto-find\n# encoding/encoding_dsv4.py under the selected model's HF hub snapshot (prefers\n# DSPARK_REVISION when set).\nDSPARK_ENCODING_FILE=\nSERVED_MODEL_NAME=deepseek-v4-flash-dspark\n# Bind to 0.0.0.0 when Hermes/OpenClaw or another machine must reach the API.\n# For a head-node-only test, set this back to 127.0.0.1.\nVLLM_HOST=0.0.0.0\n# API listen port. The launcher also accepts a temporary --port override.\nVLLM_PORT=8000\n# Explicit per-node host IPs prevent distributed vLLM/ZeroMQ from binding the\n# worker to the head node's fabric address. Set these to each node's RoCE IP.\nVLLM_HOST_IP=169.254.240.100\nWORKER_VLLM_HOST_IP=169.254.16.74\n\n# Prebuilt Anemll DSpark vLLM GX10 image (https://github.com/Anemll/dspark-vllm-gx10).\n# Digest-pinned manifest (immutable). Same bytes as the bare tag today; re-tagging\n# cannot silently change what you run. Bump deliberately:\n#   1) docker pull ghcr.io/anemll/dspark-vllm-gx10:0.1.1\n#   2) get its manifest digest (docker inspect --format '{{index .RepoDigests 0}}')\n#   3) update the @sha256: below.\nDSPARK_VLLM_IMAGE=ghcr.io/anemll/dspark-vllm-gx10:0.1.1@sha256:a83948492cf13df455170fb42885f5ef4db54fefe0feff0f841ecbff464ac9d8\n# Alternative: build locally with ./build-dspark-vllm-runtime.sh \u2192 vllm-dspark-runtime:dspark-nvfp4-stage-c\n# and merge docker-compose.stage-c.override.yml (see docs/ENVS.md).\n\n# Serving profile. DSpark k must be >= checkpoint dspark_block_size (5);\n# k<5 truncates draft blocks (silent on Anemll 0.25.2, rejected on stock 0.26+).\n# Capture size = MAX_NUM_SEQS * (MTP_NUM_TOKENS + 1); at k=5 / seqs=6 that is 36 \u2014\n# if graph capture OOMs, lower GPU_MEMORY_UTILIZATION_TEXT / _VISION toward ~0.78.\nMAX_MODEL_LEN=262144\nMAX_NUM_SEQS=10\nMAX_NUM_BATCHED_TOKENS=16384\n# Main GPU util is chosen by ENABLE_VL_SIDECAR (see Experimental: Vision in README).\n# Do not set GPU_MEMORY_UTILIZATION here \u2014 start-deepseek-v4-flash-dspark.sh\n# exports it from these two profiles:\n#   ENABLE_VL_SIDECAR=0 \u2192 GPU_MEMORY_UTILIZATION_TEXT   (larger KV)\n#   ENABLE_VL_SIDECAR=1 \u2192 GPU_MEMORY_UTILIZATION_VISION (room for VL)\nGPU_MEMORY_UTILIZATION_TEXT=0.835\nGPU_MEMORY_UTILIZATION_VISION=0.80\nMTP_NUM_TOKENS=5\n# Default reasoning mode: off, low, high, or max. \"max\" enables full\n# thinking/reasoning effort by default; request-level overrides still win.\nDEFAULT_THINKING=off\n\n# Issue #22 hotfix: automatically patches nvfp4_ds_mla long-context decode\n# regression on every start.  Set to 1 to skip (e.g. if you've already\n# applied the hotfix manually or are using a patched image).\n# DSPARK_SKIP_HOTFIX=0\n\n# No sampling override. The launcher keeps --generation-config vllm only.\n# Explicit client request parameters still win.\n\n# Higher-throughput short-context profile from the Keys concurrency patch:\n# MAX_MODEL_LEN=200000\n# MAX_NUM_SEQS=16\n#\n# Conservative prior agent lane:\n# MAX_MODEL_LEN=1048576\n# MAX_NUM_SEQS=6\n# GPU_MEMORY_UTILIZATION=0.80\n#\n# Context and concurrency share one KV pool. The conservative 1M-token lane\n# keeps 6 active sequence slots for long-context agent traffic.\n# Normal agent turns are much shorter than the maximum; multiple simultaneous\n# full-context requests may still queue depending on the live KV pool.\n\n# ---------------------------------------------------------------------------\n# Anemll 0.1.1-safe vLLM / runtime knobs (default compose injects these)\n# ---------------------------------------------------------------------------\nVLLM_USE_FLASHINFER_SAMPLER=1\nVLLM_USE_BREAKABLE_CUDAGRAPH=0\nVLLM_USE_B12X_MOE=1\nVLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM=0\nVLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M=64\nVLLM_B12X_W4A16_FORCE_TILE_CONFIG=\n\nVLLM_ALLOW_LONG_MAX_MODEL_LEN=1\nVLLM_SPARSE_INDEXER_MAX_LOGITS_MB=256\nVLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=0\n\n# CuTeDSL / b12x compile target for GB10 (not a VLLM_* registry key).\nCUTE_DSL_ARCH=sm_121a\nTORCH_CUDA_ARCH_LIST=12.1a\nFLASHINFER_CUDA_ARCH_LIST=12.1a\nFLASHINFER_DISABLE_VERSION_CHECK=1\nTILELANG_CLEANUP_TEMP_FILES=1\nDG_JIT_USE_NVRTC=0\nDG_JIT_NVCC_COMPILER=/usr/local/cuda/bin/nvcc\nNCCL_NET=IB\nNCCL_IB_DISABLE=0\nNCCL_CUMEM_ENABLE=0\nNCCL_IGNORE_CPU_AFFINITY=1\nNCCL_DEBUG=WARN\nNCCL_NVLS_ENABLE=0\nPYTORCH_CUDA_ALLOC_CONF=expandable_segments:True\n\n# ---------------------------------------------------------------------------\n# Stage-C overlay only \u2014 DO NOT enable on Anemll 0.1.1\n# Uncomment when DSPARK_VLLM_IMAGE is the Stage-C build AND you merge\n# docker-compose.stage-c.override.yml. On Anemll these VLLM_* keys warn:\n#   \"Unknown vLLM environment variable detected: \u2026\"\n# and are ignored. Full matrix: docs/ENVS.md\n# ---------------------------------------------------------------------------\n# VLLM_USE_B12X_WO_PROJECTION=1\n# VLLM_DSPARK_CONFIDENCE_THRESHOLD=0.0\n# VLLM_DSPARK_CONFIDENCE_SCHEDULER=off\n# VLLM_DSPARK_LOCAL_ARGMAX=1\n# VLLM_DSPARK_REPLICATE_MARKOV_W1=1\n# VLLM_DSPARK_FUSED_MARKOV_ARGMAX=0\n# VLLM_DSPARK_GPU_REJECTED_CONTEXT_MASK=1\n# VLLM_DSPARK_REFERENCE_KV_QUANT_DEQUANT=0\n# DSPARK_SLOT_CLAMP=1\n# VLLM_DSPARK_HARDWARE_SCHEDULER_EARLY_STOP=1\n# B12X_W4A16_TC_DECODE=0\n# VLLM_DSV4_B12X_COMPRESSED_MLA=0\n# VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE=0\n# VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE_EXACT=0\n# VLLM_TRITON_MLA_SPARSE=1\n# VLLM_SKIP_INIT_MEMORY_CHECK=1\n\n# ---------------------------------------------------------------------------\n# Vision mode flag (one switch) + VL sidecar + MCP harness install\n# ---------------------------------------------------------------------------\n# ENABLE_VL_SIDECAR=1 \u2192 start Qwen3-VL TP=2 on :8889 + MCP install, and set\n#   0731 util from GPU_MEMORY_UTILIZATION_VISION (default 0.80).\n# ENABLE_VL_SIDECAR=0 \u2192 text-only 0731, util from GPU_MEMORY_UTILIZATION_TEXT\n#   (default 0.835) for a larger KV pool.\n# Flip the flag, then ./stop-\u2026 && ./start-\u2026 (full restart required).\n#\n# Measured Available KV (this cluster, Anemll 0.1.1, 2026-08-11):\n#   text (flag=0, util 0.835): main ~18.08 GiB / ~2.49M tokens\n#   vision (flag=1, util 0.80 + VL 0.04): main 13.37 GiB / 1.37M + VL 1.54 GiB / 84k\n# Default: off (text-only, larger main KV). Vision/VL coexist is deferred to a\n# follow-up PR \u2014 leave knobs commented; they are unused while the flag is 0.\nENABLE_VL_SIDECAR=0\n# Do not download VL weights on text-only prepare (set 1 only for a vision PR).\nPREPARE_VL_SIDECAR_MODEL=0\n# VL_SIDECAR_MODEL=cyankiwi/Qwen3-VL-4B-Instruct-AWQ-4bit\n# VL_SIDECAR_SERVED_NAME=qwen3-vl-4b\n# VL_SIDECAR_PORT=8889\n# VL_SIDECAR_TP_SIZE=2\n# VL_SIDECAR_NNODES=2\n# VL_SIDECAR_MASTER_PORT=25100\n# VL_SIDECAR_GPU_UTIL=0.04\n# VL_SIDECAR_MAX_NUM_SEQS=4\n# VL_SIDECAR_MAX_MODEL_LEN=32768\n# VL_SIDECAR_KV_CACHE_DTYPE=int4_per_token_head\n# VL_SIDECAR_ATTENTION_BACKEND=TRITON_ATTN\n# Optional: VL_SIDECAR_KV_CACHE_MEMORY_BYTES=367001600\n# VL weights: ./prepare-dspark-model-cache.sh downloads VL_SIDECAR_MODEL on\n# head and worker when PREPARE_VL_SIDECAR_MODEL=1 (TP=2 needs both caches).\n# After sidecar is healthy, start can register MCP into detected harnesses\n# only when ENABLE_VL_SIDECAR=1 (installer also no-ops if the flag is off).\n# INSTALL_VISION_MCP=0 skips harness registration even when vision is on.\n# INSTALL_VISION_MCP=1\n# VISION_MCP_HARNESSES=auto\n# VISION_MCP_HARNESSES=pi,omp,hermes,opencode,goose,grok,openclaw,zcode,prime,factory,commandcode\n\n# --- local: hold issue #26 hybrid prefix-cache hotfix (issue #39 tool-name regression,\n# bisected to #26 by siraustin; v2 fix on 103af68c is unvalidated). Remove both lines to A/B.\nDSPARK_ISSUE26_HOTFIX=/home/nvidia/dspark-mia/patches/noop.py\nVLLM_PREFIX_CACHE_RETENTION_INTERVAL=\n\n# --- local: undo the #27 prefill serialization. Measured 2026-08-14 on our box:\n# cap=1 + 1024-token chunks moved 18K-prompt work from prefill into queue\n# (q 0.02s -> 6.68s at c=10), costing 24% on score vs cbd719f. PR #44 decode\n# floor stays on and covers the per-step starvation #27 targeted.\nDSPARK_ISSUE27_HOTFIX=/home/nvidia/dspark-mia/patches/noop.py\nLONG_PREFILL_TOKEN_THRESHOLD=0", "hotfixes": {"10.150.0.50": ["issue43-hotfix"], "10.150.0.51": ["issue43-hotfix"]}, "deployment": "compose", "config_file": "env.dspark", "workload": null, "gates": {"smoke": true, "toolprobe": true, "loadgen": true, "decode_shapes": null}, "metrics": {"n": 2, "score": 100.7481051615578, "ttft_p95": 7.137302513932809, "tps_req": 23.05683854141313, "tps_agg": 75.06615578687753, "spread": 1.118664584550773, "preempt": 0.0, "cache": 83.81332889406804, "queue": 1.4870357699692249e-05, "prefill": 4.801765309693292}, "levels": [{"c": 1, "n": 2, "score": 33.05343694169079, "ttft_p50": 1.464251291938126, "ttft_p95": 1.464251291938126, "total_p95": 6.788969755987637, "tps_req": 58.29276695184306, "tps_agg": 45.21050556877347, "tpot": 0.017808422956687327, "out": 300.0, "prompt": 18021.0, "queue": 9.024050086736679e-06, "prefill": 1.403839584090747, "cache": 83.81332889406804, "preempt": 0.0, "ok": "2/2"}, {"c": 5, "n": 2, "score": 100.74313329005474, "ttft_p50": 7.136063820449635, "ttft_p95": 7.13730 :\"<\/think>\"}'", "--default-chat-template-kwargs": "'{\"thinking\":false}'", "--generation-config": "vllm", "--enable-flashinfer-autotune": true, "--nnodes": "2", "--node-rank": "0", "--master-addr": "10.150.0.50", "--master-port": "25000"}, "env_text": "# DeepSeek V4 Flash 0731 (official) DSpark \u2014 1M context, NVFP4 KV \u2014 2x DGX Spark\n#\n# sparkrun port of:\n#   https://github.com/tonyd2wild/DeepSeek-v4-Flash-0731-DSpark-1M-NVFP4-KV-2x-DGX-Spark\n# (pinned to commit d728faee9f5a8d5ebafe7bc44bca6c5d8d0d192f, 2026-07-31)\n#\n# This is the recipe for DeepSeek's OFFICIAL `DeepSeek-V4-Flash-0731` release,\n# contributed via issue #9. See sparkrun/README.md for quick start and\n# measured results; the main repo README stays the reference for everything\n# else (tuning, troubleshooting, patch history).\n#\n# Fully reproducible, no manual image build: the recipe pulls the public\n# DSpark-enabled base image and reproduces tonyd2wild's\n# `vllm-dspark-runtime:dspark-nvfp4-stage-c` image at container start via\n# pre_exec (base overlay -> nvfp4 stage A/B/C patches). The overlay at this\n# pin already contains ALL known fixes:\n#   * Patch 3 (scheduler cold-prefill garble root fix; without it 44/44\n#     cold ~20K-token prompts garbled, warm requests never fail \u2014 invisible\n#     until production)\n#   * Patch 4 (DSpark draft loader shared-expert fix, 2026-07-31). vLLM's\n#     stock loader silently drops 12 draft tensors\n#     (layers.{43,44,45}.ffn.shared_experts.gate_up_proj.*); the draft's\n#     always-on shared expert then runs uninitialised. Output stays correct\n#     (the target verifies every token) but acceptance collapses:\n#     0731 measured 25.7% -> 60.2% acceptance, 32.7 -> 55.4 mean tok/s\n#     with the fix. On 0731 this patch is THE difference between \"half\n#     speed\" and the advertised numbers.\n#   * native non-uniform-batch handling in the proposer (concurrency>=2\n#     crash fix). NOTE: upstream's apply-nonuniform-guard.py is deliberately\n#     NOT run here \u2014 it is for foreign prebuilt images only. Stacking it on\n#     this overlay short-circuits the proposer's own ragged path and emits\n#     always-rejected dummy drafts (\"Drafted: N, Accepted: 0\" windows).\n#\n# Defaults = upstream's \"CURRENT BEST\" profile (DEFAULT-CONFIG.md,\n# re-measured 2026-07-29): 1M context, 6 slots, gmu 0.78, k=5.\n# Upstream-measured on 0731 + Patch 4: 55.4 tok/s mean / 66.1 peak by\n# content type (structured 66, codegen 62, prose 38), 78.4 tok/s peak-finder\n# at 98.9% acceptance. Decode is acceptance-bound and content-driven \u2014\n# quote peak AND mean AND content type.\n#\n# IMPORTANT invariants (from the upstream repo):\n#   * num_speculative_tokens: k <= 5, or a multiple of 5. The 0731 drafter\n#     emits exactly dspark_block_size=5 tokens per pass: k=7 boots only if\n#     you patch the guard out and then crashes on the FIRST generation\n#     (\"size of tensor a (7) must match tensor b (5)\"); k=10 boots and\n#     crashes every generation. k=5 is ~24% faster than k=3. DeepSeek's own\n#     0731 model card recommends k=7 \u2014 that does not work on this runtime.\n#   * max_cudagraph_capture_size is deliberately NOT set: vLLM derives it\n#     from max_num_seqs x (k+1). A stale literal silently truncates capture\n#     under concurrency (upstream PR #5).\n#   * VLLM_USE_B12X_MOE=1 is the entire speed difference (~2x). =0 silently\n#     falls back to DEEPGEMM_MXFP4 (and measured worse, then crashed).\n#   * Do NOT add repetition_penalty / --override-generation-config\n#     (documented DSpark spec-decode crash: illegal memory access).\n#   * Do NOT set VLLM_USE_V2_MODEL_RUNNER=1 (hard reject with DSpark).\n#   * Do NOT pass --attention-backend FLASHINFER_MLA_SPARSE_DSV4\n#     (backend does not exist on this image; leave attention on AUTO).\n#   * gpu_memory_utilization 0.78: spec decode allocates buffers on the\n#     FIRST REAL REQUEST, not at boot \u2014 0.80 boots, passes smoke tests,\n#     then dies under traffic (upstream issue #8). max_num_seqs 12 is a\n#     known trigger for the same crash class; 6 measured better under real\n#     traffic anyway.\n\nrecipe_version: \"2\"\nmodel: deepseek-ai/DeepSeek-V4-Flash-0731\nruntime: vllm\n# Digest-pinned tag `unholy-fusion-prod-ready` (resolved 2026-07-12) so the\n# base image is immutable even if the tag is later repushed. Upstream tested\n# the newer vLLM 0.25.2 runtime head-to-head on 2026-07-29 and kept this one\n# (0.25.2: -9% peak, -29% at c6 \u2014 no B12X kernels, no torch.compile path).\ncontainer: ghcr.io/bjk110/vllm-spark@sha256:d8492e7677cf1b9aaa3344e0e6865efc468454013eee5ebabac85be90af027be\nmin_nodes: 2\nmax_nodes: 2\n\nmetadata:\n  description: >-\n    DeepSeek V4 Flash 0731 (official release) with DSpark speculative\n    decoding on 2x DGX Spark (TP=2): 1M-token context, 4-bit nvfp4_ds_mla\n    KV cache, B12X MoE, draft-loader Patch 4. Upstream-measured ~55 tok/s\n    mean / 66 peak by content (78 peak-finder). Port of\n    tonyd2wild/DeepSeek-v4-Flash-0731-DSpark-1M-NVFP4-KV-2x-DGX-Spark.\n  maintainer: tonyd2wild\n  category: agent\n  kv_dtype: nvfp4\n\ndefaults:\n  port: 8000\n  host: 0.0.0.0\n  tensor_parallel: 2\n  pipeline_parallel: 1\n  served_model_name: deepseek-v4-flash-dspark\n  kv_cache_dtype: nvfp4_ds_mla\n  block_size: 256\n  # 1,048,576 = the model's true YaRN ceiling (65536 x factor 16). The\n  # upstream 1.5M runs only force-extrapolate past calibration \u2014 keep 1M.\n  max_model_len: 262144\n  # 6 slots / 0.78 gmu = upstream CURRENT BEST. 12/0.85 (the old C12 lane)\n  # boots fine but is the documented trigger profile for the issue-#8\n  # first-request OOM class; raise it only with eyes open.\n  max_num_seqs: 6\n  max_num_batched_tokens: 8192\n  gpu_memory_utilization: 0.78\n  tokenizer_mode: deepseek_v4\n  tool_call_parser: deepseek_v4\n  reasoning_parser: deepseek_v4\n  # k=5: the verified default (+24% over k=3; k is effectively locked to 5\n  # on this drafter \u2014 see invariants above). draft_sample_method is kept for\n  # parity with upstream's launcher but is a documented NO-OP on the DSpark\n  # path (the proposer never populates draft probs unless\n  # VLLM_DSPARK_EXPORT_DRAFT_PROBS=1); the garble fix is Patch 3, not this.\n  speculative_config: '{\"method\":\"dspark\",\"num_speculative_tokens\":5,\"draft_sample_method\":\"probabilistic\"}'\n  reasoning_config: '{\"reasoning_parser\":\"deepseek_v4\",\"reasoning_start_str\":\"<think>\",\"reasoning_end_str\":\"<\/think>\"}'\n  chat_template_kwargs: '{\"thinking\":false}'\n\n# Defaults for `sparkrun benchmark run` (zero flags needed; -b/--profile\n# still override). DSpark decode speed depends on draft acceptance, which is\n# workload-dependent (structured ~66 tok/s, codegen ~62, prose ~38 on 0731),\n# and llama-benchy's default corpus is a Gutenberg novel \u2014 that would\n# under-report this recipe for coding/devops use. So the corpus is pinned to\n# a large real-world source file. Swap book_url for any raw text URL (your\n# own code/YAML/Terraform corpus) to benchmark your workload mix.\n#\n# Two measurement caveats from upstream (2026-07-29/31), both matter here:\n#   * WARM UP FIRST: the first requests after boot \u2014 or after ~30 min idle \u2014\n#     run ~30% slow (58 vs 83 tok/s upstream), and the boot log looks ready.\n#     Send a few 500+-token generations before trusting any number.\n#   * If you measure by hand: use stream:false and usage.completion_tokens.\n#     Under spec decode vLLM emits one SSE chunk per decode STEP (carrying\n#     all accepted tokens), so counting stream deltas measures steps/s and\n#     under-reports by the acceptance length (14.7 vs 60.1 on the same\n#     request). llama-benchy counts tokens, not chunks \u2014 it is not affected.\nbenchmark:\n  framework: llama-benchy\n  timeout: 7200\n  # Default matrix is sized to finish in ~15 min. Deep-context cells are\n  # enormously expensive (every stream prefills its own fresh 32K/131K slice\n  # per run at ~2.6K tok/s prefill): a full depth-131072 x high-concurrency\n  # sweep takes hours. Run heavy cells explicitly when needed, e.g.:\n  #   -b depth=131072 -b concurrency=1     (~5 min: decode-at-depth check)\n  #   -b depth=131072 -b concurrency=6     (hours: worst-case prefill storm)\n  args:\n    pp: [2048]\n    tg: [128]\n    depth: [0, 32768]\n    concurrency: [1, 2, 6]\n    runs: 2\n    # Corpus A (default): hard real-world code \u2014 TypeScript compiler internals.\n    # Lower draft acceptance, the conservative coding number.\n    book_url: https://raw.githubusercontent.com/microsoft/TypeScript/v5.5.4/src/compiler/checker.ts\n    # Corpus B (A/B alternate): boilerplate-heavy HTML \u2014 the WHATWG HTML spec\n    # source (7.9 MB of repetitive markup, pinned commit). High-redundancy text\n    # -> higher draft acceptance -> upper-bound decode speed. Switch per run:\n    #   -b book_url=https://raw.githubusercontent.com/whatwg/html/88ae68cb961651f0f92c5d2046049f53ecdfc6cf/source\n    # llama-benchy caches each corpus by URL hash (~/.cache/llama-benchy), so\n    # switching back and forth costs nothing after the first download.\n    # Must be here, not only in defaults: sparkrun v0.2.40 builds the per-task\n    # benchmark commands BEFORE it injects served_model_name from the config\n    # chain (ordering bug), so llama-benchy would otherwise request the HF ID\n    # and get a 404 from the alias-served endpoint.\n    served_model_name: deepseek-v4-flash-dspark\n\nenv:\n  # Line-buffer python output even when redirected to the serve log \u2014\n  # without this, a hard crash during startup loses the buffered output\n  # and the failure log is empty.\n  PYTHONUNBUFFERED: \"1\"\n  # --- core runtime (mirrors upstream docker-compose.dspark.yml) ---\n  # Second-startup stability: engine-ready timeout defaults to 600 s, which\n  # trips torch.distributed teardown during warm restarts of this model.\n  VLLM_ENGINE_READY_TIMEOUT_S: \"3600\"\n  VLLM_ALLOW_LONG_MAX_MODEL_LEN: \"1\"\n  VLLM_TRITON_MLA_SPARSE: \"1\"\n  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: \"256\"\n  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: \"0\"\n  VLLM_SKIP_INIT_MEMORY_CHECK: \"1\"\n  # WARNING: this assumes /cache/huggingface is NODE-LOCAL. If you share the HF\n  # cache between the two nodes over NFS to avoid downloading 167 GB twice, both\n  # ranks JIT into the same directories and you get, in order: a torch.compile\n  # makedirs race, DeepGEMM \"runtime != nullptr\" from half-written cubins, and an\n  # ABI-mismatched FlashInfer sampling.so built by one node and silently loaded\n  # by the other (silent because FLASHINFER_DISABLE_VERSION_CHECK=1 below).\n  # In that case override ALL SEVEN onto a node-local path \u2014 the set matters:\n  #   VLLM_CACHE_ROOT, DG_JIT_CACHE_DIR, FLASHINFER_WORKSPACE_BASE,\n  #   TILELANG_CACHE_DIR, TORCHINDUCTOR_CACHE_DIR, TRITON_CACHE_DIR,\n  #   TORCH_EXTENSIONS_DIR\n  # See README \"Sharing the HF cache over NFS\" and issue #27 (@antoniohlc).\n  VLLM_CACHE_ROOT: /cache/huggingface/vllm-cache\n  HF_HUB_DISABLE_XET: \"1\"\n  # FlashInfer sampler is part of the 2026-07-03 DSpark garble fix.\n  VLLM_USE_FLASHINFER_SAMPLER: \"1\"\n  # --- B12X: =1 is essential; =0 measured worse, then crashed ---\n  VLLM_USE_B12X_MOE: \"1\"\n  VLLM_USE_B12X_WO_PROJECTION: \"1\"\n  VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM: \"0\"\n  VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M: \"16\"\n  B12X_W4A16_TC_DECODE: \"0\"\n  # --- DSpark speculative-decoding switches (upstream validated set) ---\n  VLLM_DSPARK_CONFIDENCE_THRESHOLD: \"0.0\"\n  VLLM_DSPARK_CONFIDENCE_SCHEDULER: \"off\"\n  VLLM_DSPARK_LOCAL_ARGMAX: \"1\"\n  VLLM_DSPARK_REPLICATE_MARKOV_W1: \"1\"\n  VLLM_DSPARK_FUSED_MARKOV_ARGMAX: \"0\"\n  # =1 also activates the proposer's native ragged-batch path (mixed\n  # prefill/decode under chunked prefill) \u2014 the in-tree successor to the\n  # old skip-speculation guard.\n  VLLM_DSPARK_GPU_REJECTED_CONTEXT_MASK: \"1\"\n  VLLM_DSPARK_REFERENCE_KV_QUANT_DEQUANT: \"0\"\n  VLLM_DSPARK_HARDWARE_SCHEDULER_EARLY_STOP: \"1\"\n  VLLM_DSV4_B12X_COMPRESSED_MLA: \"0\"\n  VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE: \"0\"\n  VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE_EXACT: \"0\"\n  # Long-context crash fix kill-switch: clamp stale DSpark draft-KV slot ids.\n  DSPARK_SLOT_CLAMP: \"1\"\n  # --- toolchain / JIT (GB10 is sm_121; arch list per upstream) ---\n  TORCH_CUDA_ARCH_LIST: \"12.1a\"\n  FLASHINFER_CUDA_ARCH_LIST: \"12.1a\"\n  FLASHINFER_DISABLE_VERSION_CHECK: \"1\"\n  TILELANG_CLEANUP_TEMP_FILES: \"1\"\n  DG_JIT_USE_NVRTC: \"0\"\n  DG_JIT_NVCC_COMPILER: /opt/env/bin/nvcc\n  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True\n  # --- NCCL extras not covered by sparkrun's per-host IB auto-detection ---\n  NCCL_CUMEM_ENABLE: \"0\"\n  NCCL_NVLS_ENABLE: \"0\"\n  # LOCAL PIN, not upstream's: on this pair sparkrun's IB auto-detection picks\n  # roceP2p1s0f1, which is the UNCABLED port \u2014 its GID table is all zeros past index 1,\n  # so the first NCCL connect dies with\n  #   ibv_modify_qp failed with 61 ... local GID ::, remote GID ::\n  # and the engine never starts. The cabled 200G QSFP link is rocep1s0f1, whose GID\n  # index 3 is the RoCE v2 entry for 169.254.240.100/16 on enp1s0f1np1. Same four pins\n  # our deepseek-v4-flash-0731.yaml carries, and for the same reason.\n  NCCL_SOCKET_IFNAME: enp1s0f1np1\n  NCCL_IB_HCA: rocep1s0f1:1\n  NCCL_IB_GID_INDEX: \"3\"\n\nexecutor_config:\n  shm_size: 64gb\n\n# Reproduce tonyd2wild's `vllm-dspark-runtime:dspark-nvfp4-stage-c` image\n# inside every container before serving:\n#   1. fetch the pinned upstream repo tarball\n#   2. apply the base DSpark overlay (== the whole recipe/overlay/vllm tree;\n#      carries Patch 3, Patch 4 and the native concurrency fix \u2014 see header)\n#   3. run the nvfp4 stage A/B/C anchor patches embedded in the stage\n#      Dockerfiles (fail-fast if an anchor is missing)\n#   4. verify Patch 3 + Patch 4 landed (same checks as upstream's\n#      check-patch3.sh preflight) and that everything still compiles\npre_exec:\n  # The bjk110 image ships no standalone `kill` binary (no procps), but\n  # sparkrun's serve health check runs `docker exec <c> kill -0 <pid>`,\n  # which needs one \u2014 without it the check false-negatives (\"Serve process\n  # exited immediately\") while the server is actually fine. Install a\n  # wrapper that delegates to the bash builtin.\n  - |\n    if [ ! -x /usr/bin/kill ] && [ ! -x /bin/kill ] && [ ! -x /usr/local/bin/kill ]; then\n      printf '#!/bin/bash\\nbuiltin kill \"$@\"\\n' > /usr/local/bin/kill\n      chmod +x /usr/local/bin/kill\n      echo \"[dspark-overlay] installed /usr/local/bin/kill shim (image has no kill binary)\"\n    fi\n  - |\n    set -eu\n    VLLM_ROOT=/opt/env/lib/python3.12/site-packages/vllm\n    SRC=/tmp/dspark-overlay-src\n    COMMIT=2d4820f025d2e8eb118cdecb07ccafdd0587aa48\n    if [ -e \"$VLLM_ROOT/.sparkrun-dspark-overlay-$COMMIT\" ]; then\n      echo \"[dspark-overlay] already applied, skipping\"\n      exit 0\n    fi\n    echo \"[dspark-overlay] fetching tonyd2wild recipe @ $COMMIT\"\n    rm -rf \"$SRC\" /tmp/dspark-overlay.tar.gz\n    mkdir -p \"$SRC\"\n    /opt/env/bin/python -c \"import sys,urllib.request; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])\" \\\n      \"https://codeload.github.com/tonyd2wild/DeepSeek-v4-Flash-0731-DSpark-1M-NVFP4-KV-2x-DGX-Spark/tar.gz/$COMMIT\" \\\n      /tmp/dspark-overlay.tar.gz\n    tar -xzf /tmp/dspark-overlay.tar.gz -C \"$SRC\" --strip-components=1\n    echo \"[dspark-overlay] applying base DSpark overlay files\"\n    cp -a \"$SRC/recipe/overlay/vllm/.\" \"$VLLM_ROOT/\"\n    for stage in a b c; do\n      echo \"[dspark-overlay] applying nvfp4 stage-$stage patch\"\n      sed -n \"/<<'PY'/,/^PY$/p\" \"$SRC/recipe/nvfp4/Dockerfile.stage-$stage\" | sed '1d;$d' | /opt/env/bin/python -\n    done\n    # NOTE: upstream's apply-nonuniform-guard.py is intentionally NOT run.\n    # It exists for foreign prebuilt images whose proposer lacks the\n    # concurrency fix; this overlay's proposer handles non-uniform batches\n    # natively, and stacking the guard on top of it short-circuits that path\n    # into always-rejected dummy drafts (\"Drafted: N, Accepted: 0\").\n    echo \"[dspark-overlay] verifying Patch 3 (cold-prefill garble fix) is present\"\n    grep -q \"is_prefill_chunk\" \"$VLLM_ROOT/v1/core/sched/scheduler.py\" \\\n      || { echo \"[dspark-overlay] FATAL: Patch 3 missing \u2014 cold prefills would garble\"; exit 1; }\n    echo \"[dspark-overlay] verifying Patch 4 (draft shared-expert loader fix) is present\"\n    grep -q \"shared_experts.gate_up_proj\" \"$VLLM_ROOT/v1/spec_decode/dspark.py\" \\\n      || { echo \"[dspark-overlay] FATAL: Patch 4 missing \u2014 0731 would run at half speed\"; exit 1; }\n    find \"$VLLM_ROOT\" -name __pycache__ -type d -prune -exec rm -rf {} + || true\n    /opt/env/bin/python -m py_compile \"$VLLM_ROOT/envs.py\" \"$VLLM_ROOT/v1/core/sched/scheduler.py\" \"$VLLM_ROOT/v1/spec_decode/dspark.py\" \"$VLLM_ROOT/v1/spec_decode/dspark_proposer.py\"\n    touch \"$VLLM_ROOT/.sparkrun-dspark-overlay-$COMMIT\"\n    echo \"[dspark-overlay] done: runtime now equivalent to vllm-dspark-runtime:dspark-nvfp4-stage-c @ $COMMIT\"\n\n# NOTE: no post_exec speed-test hook here, on purpose. sparkrun v0.2.40\n# runs post hooks BEFORE it starts following logs, gated on a hardcoded\n# 4-minute port-readiness timeout (wait_for_port: 120 x 2s) \u2014 this model\n# needs ~5-6 min to open the port, so any recipe post hook makes the\n# launch error out with \"Server port never became ready\" while the\n# cluster actually boots fine in the background. Use the standalone\n# ./speedtest-starfall.sh against the running server instead.\n\n# Mirrors the upstream compose launcher. sparkrun's vllm-distributed runtime\n# appends --nnodes / --node-rank / --master-addr / --master-port (+ --headless\n# on the worker) automatically; NCCL_IB_HCA / NCCL_SOCKET_IFNAME / GID are\n# injected per host by sparkrun's InfiniBand auto-detection.\n# Notes:\n#   * --generation-config vllm and NO --override-generation-config is part\n#     of the garble fix (explicit client request params still win).\n#   * --max-cudagraph-capture-size is deliberately absent \u2014 vLLM derives\n#     max_num_seqs x (k+1); a stale literal silently truncates capture.\ncommand: |\n  export PATH=/opt/env/bin:/opt/env/nvvm/bin:/opt/env/targets/sbsa-linux/nvvm/bin:$PATH &&\n  export CUDA_HOME=/opt/env/targets/sbsa-linux CUDA_PATH=/opt/env/targets/sbsa-linux CUDAToolkit_ROOT=/opt/env/targets/sbsa-linux &&\n  export LD_LIBRARY_PATH=/opt/env/lib:/opt/env/targets/sbsa-linux/lib:$LD_LIBRARY_PATH &&\n  /opt/env/bin/vllm serve {model} \\\n    --served-model-name {served_model_name} \\\n    --host {host} \\\n    --port {port} \\\n    --trust-remote-code \\\n    --tensor-parallel-size {tensor_parallel} \\\n    --pipeline-parallel-size {pipeline_parallel} \\\n    --kv-cache-dtype {kv_cache_dtype} \\\n    --block-size {block_size} \\\n    --max-model-len {max_model_len} \\\n    --max-num-seqs {max_num_seqs} \\\n    --max-num-batched-tokens {max_num_batched_tokens} \\\n    --gpu-memory-utilization {gpu_memory_utilization} \\\n    --enable-prefix-caching \\\n    --async-scheduling \\\n    --enable-chunked-prefill \\\n    --speculative-config '{speculative_config}' \\\n    --tokenizer-mode {tokenizer_mode} \\\n    --distributed-executor-backend mp \\\n    --tool-call-parser {tool_call_parser} \\\n    --enable-auto-tool-choice \\\n    --reasoning-parser {reasoning_parser} \\\n    --reasoning-config '{reasoning_config}' \\\n    --default-chat-template-kwargs '{chat_template_kwargs}' \\\n    --generation-config vllm \\\n    --enable-flashinfer-autotune\n", "hotfixes": {"10.150.0.50": ["sparkrun-dspark-overlay-2d4820f025d2e8eb118cdecb07ccafdd0587aa48"], "10.150.0.51": ["sparkrun-dspark-overlay-2d4820f025d2e8eb118cdecb07ccafdd0587aa48"]}, "deployment": "sparkrun", "config_file": "recipe.yaml", "workload": null, "gates": {"smoke": true, "toolprobe": true, "loadgen": true, "decode_shapes": null}, "metrics": {"n": 2, "score": 119.6400248845315, "ttft_p95": 7.5441277616191655, "tps_req": 18.310964623863956, "tps_agg": 62.9409358104741, "spread": 0.6377792864179576, "preempt": 0.0, "cache": 83.81332889406804, "queue": 0.001551876892335713, "prefill": 6.062488879263402}, "levels": [{"c": 1, "n": 2, "score": 33.321062612808646, "ttft_p50": 1.5717277475632727, "ttft_p95": 1.5717277475632727, "total_p95": 6.647560399607755, "tps_req": 58.910338126654665, "tps_agg": 45.11347193426144, "tpot": 0.016976028936603618, "out": 300.0, "prompt": 18021.0, "queue": 1.4295917935669422e-05, "prefill": 1.5089308596216142, "cache": 83.81332889406804, "preempt": 0.0, "ok": "2/2"}, {"c": 5, "n": 2, "score": 119.6387698739551, "ttft_p50": 7.5414427450159565, "ttft_p95": 7.5441277616191655, "total_p95": 23.81522335507907, "tps_req": 18.310964623863956, "tps_agg": 62.9409358104741, "tpot": 0.054612924050957114, "out": 300.0, "prompt": 18021.0, "queue": 0.001551876892335713, "prefill": 6.062488879263402, "cache": 83.81332889406804, "preempt": 0.0, "ok": "10/10"}, {"c": 10, "n": 2, "score": 218.13983182638754, "ttft_p50": 9.004228379111737, "ttft_p95": 27.968571391538717, "total_p95": 39.42468138609547, "tps_req": 19.157828287945208, "tps_agg": 76.0708669133754, "tpot": 0.05225297675482045, "out": 300.0, "prompt": 18021.0, "queue": 8.099424041167367, "prefill": 3.7877227257820776, "cache": 83.81332889406804, "preempt": 0.0, "ok": "20/20"}], "note": null}, {"dir": "2026-08-14T08-53Z__103af68c-no26-no27", "ref": "103af68c-no26-no27", "provenance": "full", "captured_utc": "2026-08-14T08:52:59+00:00", "served_model_name": "deepseek-v4-flash-dspark", "model": "deepseek-ai/DeepSeek-V4-Flash-0731", "dspark_sha": "103af68cad84a153c8e6bd3b15e6414a12b71e05", "vllm_version": "0.25.2.dev0+g752a3a504.d20260714", "serve_flags": {"_model": "deepseek-ai/DeepSeek-V4-Flash-0731", "--no-deps;": "export", "--served-model-name": "deepseek-v4-flash-dspark", "--host": "0.0.0.0", "--port": "8000", "--trust-remote-code": "${VLLM_QUANTIZATION_ARGS}", "--tensor-parallel-size": "2", "--pipeline-parallel-size": "1", "--kv-cache-dtype": "nvfp4_ds_mla", "--block-size": "256", "--max-model-len": "262144", "--max-num-seqs": "10", "--max-num-batched-tokens": "16384", "--long-prefill-token-threshold": "0", "--max-cudagraph-capture-size": "$((", "--gpu-memory-utilization": "0.835", "--enable-prefix-caching": true, "--enable-prompt-tokens-details": true, "--async-scheduling": true, "--enable-chunked-prefill": true, "--speculative-config": "\"${SPECULATIVE_CONFIG}\"", "--tokenizer-mode": "deepseek_v4", "--distributed-executor-backend": "mp", "--moe-backend": "flashinfer_b12x", "--tool-call-parser": "deepseek_v4", "--enable-auto-tool-choice": true, "--reasoning-parser": "deepseek_v4", "--reasoning-config": "'{\"reasoning_parser\":\"deepseek_v4\",\"reasoning_start_str\":\"<think>\",\"reasoning_end_str\":\"<\/think>\"}'", "--default-chat-template-kwargs": "\"${DEFAULT_CHAT_TEMPLATE_KWARGS}\"", "--generation-config": "vllm", "--override-generation-config": "'{\"top_p\":0.95}'", "--enable-flashinfer-autotune": true, "--nnodes": "2", "--node-rank": "0", "--master-addr": "169.254.240.100", "--master-port": "25000"}, "env_text": "# DeepSeek V4 Flash DSpark C12 NVFP4 profile for 2x DGX Spark TP=2.\n# Copy to .env.dspark on each node and adjust node-specific values.\n#\n# Env matrix (Anemll 0.1.1 vs Stage-C overlay): see docs/ENVS.md\n# Default image is Anemll \u2014 keep Stage-C-only VLLM_* keys commented unless\n# you build/run the Stage-C image and merge docker-compose.stage-c.override.yml.\n\n# Cluster\nWORKER_HOST=10.150.0.51\n# Worker-local checkout/deployment path. Leave blank to mirror the head path.\nWORKER_DIR=\n# Optional explicit worker checkout path. This is useful when the worker clone\n# lives somewhere different from the head checkout; it takes precedence over\n# WORKER_DIR when set.\nWORKER_SCRIPT_DIR=\nMASTER_ADDR=169.254.240.100\nMASTER_PORT=25000\nNODE_RANK=0\nHEADLESS=\n\n# Worker node should use:\n# NODE_RANK=1\n# HEADLESS=1\n\n# RoCE / InfiniBand (head node). On a QSFP ring, the worker's facing port\n# name often differs \u2014 set WORKER_NCCL_* below; start-*.sh passes them remotely.\nNCCL_IB_HCA=rocep1s0f1\nNCCL_SOCKET_IFNAME=enp1s0f1np1\nTP_SOCKET_IFNAME=enp1s0f1np1\nGLOO_SOCKET_IFNAME=enp1s0f1np1\n# Optional worker overrides (defaults to the head values if unset).\n# Set these on the HEAD .env; start-deepseek-v4-flash-dspark.sh injects them on\n# remote compose (shared/scp'd .env is fine). Do not rely on WORKER_* first in\n# docker-compose \u2014 that substitution is not rank-aware.\n# WORKER_NCCL_IB_HCA=rocep1s0f0\n# WORKER_NCCL_SOCKET_IFNAME=enp1s0f0np0\n# WORKER_TP_SOCKET_IFNAME=enp1s0f0np0\n# WORKER_GLOO_SOCKET_IFNAME=enp1s0f0np0\n# RoCEv2 GID index: start-*.sh resolves per node from sysfs by default\n# (NCCL_IB_GID_AUTO=1). Index differs per node/HCA and drifts after reboot;\n# a single shared literal on both ranks can wedge NCCL at init.\n# Pin only when you disable auto:\n# NCCL_IB_GID_AUTO=0\n# NCCL_IB_GID_INDEX=3\n# WORKER_NCCL_IB_GID_INDEX=6\n# Optional match IPs if the RoCE address is not the ifname primary IPv4:\n# NCCL_IB_GID_MATCH_IP=10.0.22.1\n# WORKER_NCCL_IB_GID_MATCH_IP=10.0.22.2\nNCCL_CROSS_NIC=1\n\n# Caches / model\nHF_CACHE=${HOME}/.cache/huggingface\n# Optional worker-local Hugging Face cache. Use this when the worker user/path\n# differs from the head node. If blank, the worker uses HF_CACHE.\nWORKER_HF_CACHE=\n# Prefer offline when both nodes already have a full hub cache (online re-download can fill worker disks).\nHF_HUB_OFFLINE=1\nTRANSFORMERS_OFFLINE=1\nHF_HUB_DISABLE_XET=1\n# Checkpoint flag: 0 = official 0731, 1 = abliterated (Keys).\n# start- / prepare- resolve DSPARK_MODEL from this \u2014 do not set DSPARK_MODEL by hand.\nABLITERATED=0\nDSPARK_MODEL_OFFICIAL=deepseek-ai/DeepSeek-V4-Flash-0731\nDSPARK_MODEL_ABLITERATED=drowzeys/keys-DeepSeekV4-Flash-GA-0731-Dspark-Abliterated-32-32\n# Pin official HF revision (issue #19). Default when unset: tested 9e165c30\u2026\n# Set DSPARK_REVISION= (empty) to follow tip of main. Abliterated uses\n# DSPARK_REVISION_ABLITERATED (empty = tip of that repo).\nDSPARK_REVISION=7872f01b1d1fe23eabc4c98b48bffcef5a386062\n# DSPARK_REVISION_ABLITERATED=\n# Optional pin for the 0731 encoder inside the container. Leave empty to auto-find\n# encoding/encoding_dsv4.py under the selected model's HF hub snapshot (prefers\n# DSPARK_REVISION when set).\nDSPARK_ENCODING_FILE=\nSERVED_MODEL_NAME=deepseek-v4-flash-dspark\n# Bind to 0.0.0.0 when Hermes/OpenClaw or another machine must reach the API.\n# For a head-node-only test, set this back to 127.0.0.1.\nVLLM_HOST=0.0.0.0\n# API listen port. The launcher also accepts a temporary --port override.\nVLLM_PORT=8000\n# Explicit per-node host IPs prevent distributed vLLM/ZeroMQ from binding the\n# worker to the head node's fabric address. Set these to each node's RoCE IP.\nVLLM_HOST_IP=169.254.240.100\nWORKER_VLLM_HOST_IP=169.254.16.74\n\n# Prebuilt Anemll DSpark vLLM GX10 image (https://github.com/Anemll/dspark-vllm-gx10).\n# Digest-pinned manifest (immutable). Same bytes as the bare tag today; re-tagging\n# cannot silently change what you run. Bump deliberately:\n#   1) docker pull ghcr.io/anemll/dspark-vllm-gx10:0.1.1\n#   2) get its manifest digest (docker inspect --format '{{index .RepoDigests 0}}')\n#   3) update the @sha256: below.\nDSPARK_VLLM_IMAGE=ghcr.io/anemll/dspark-vllm-gx10:0.1.1@sha256:a83948492cf13df455170fb42885f5ef4db54fefe0feff0f841ecbff464ac9d8\n# Alternative: build locally with ./build-dspark-vllm-runtime.sh \u2192 vllm-dspark-runtime:dspark-nvfp4-stage-c\n# and merge docker-compose.stage-c.override.yml (see docs/ENVS.md).\n\n# Serving profile. DSpark k must be >= checkpoint dspark_block_size (5);\n# k<5 truncates draft blocks (silent on Anemll 0.25.2, rejected on stock 0.26+).\n# Capture size = MAX_NUM_SEQS * (MTP_NUM_TOKENS + 1); at k=5 / seqs=6 that is 36 \u2014\n# if graph capture OOMs, lower GPU_MEMORY_UTILIZATION_TEXT / _VISION toward ~0.78.\nMAX_MODEL_LEN=262144\nMAX_NUM_SEQS=10\nMAX_NUM_BATCHED_TOKENS=16384\n# Main GPU util is chosen by ENABLE_VL_SIDECAR (see Experimental: Vision in README).\n# Do not set GPU_MEMORY_UTILIZATION here \u2014 start-deepseek-v4-flash-dspark.sh\n# exports it from these two profiles:\n#   ENABLE_VL_SIDECAR=0 \u2192 GPU_MEMORY_UTILIZATION_TEXT   (larger KV)\n#   ENABLE_VL_SIDECAR=1 \u2192 GPU_MEMORY_UTILIZATION_VISION (room for VL)\nGPU_MEMORY_UTILIZATION_TEXT=0.835\nGPU_MEMORY_UTILIZATION_VISION=0.80\nMTP_NUM_TOKENS=5\n# Default reasoning mode: off, low, high, or max. \"max\" enables full\n# thinking/reasoning effort by default; request-level overrides still win.\nDEFAULT_THINKING=off\n\n# Issue #22 hotfix: automatically patches nvfp4_ds_mla long-context decode\n# regression on every start.  Set to 1 to skip (e.g. if you've already\n# applied the hotfix manually or are using a patched image).\n# DSPARK_SKIP_HOTFIX=0\n\n# No sampling override. The launcher keeps --generation-config vllm only.\n# Explicit client request parameters still win.\n\n# Higher-throughput short-context profile from the Keys concurrency patch:\n# MAX_MODEL_LEN=200000\n# MAX_NUM_SEQS=16\n#\n# Conservative prior agent lane:\n# MAX_MODEL_LEN=1048576\n# MAX_NUM_SEQS=6\n# GPU_MEMORY_UTILIZATION=0.80\n#\n# Context and concurrency share one KV pool. The conservative 1M-token lane\n# keeps 6 active sequence slots for long-context agent traffic.\n# Normal agent turns are much shorter than the maximum; multiple simultaneous\n# full-context requests may still queue depending on the live KV pool.\n\n# ---------------------------------------------------------------------------\n# Anemll 0.1.1-safe vLLM / runtime knobs (default compose injects these)\n# ---------------------------------------------------------------------------\nVLLM_USE_FL --------------------------------------------------\n# ENABLE_VL_SIDECAR=1 \u2192 start Qwen3-VL TP=2 on :8889 + MCP install, and set\n#   0731 util from GPU_MEMORY_UTILIZATION_VISION (default 0.80).\n# ENABLE_VL_SIDECAR=0 \u2192 text-only 0731, util from GPU_MEMORY_UTILIZATION_TEXT\n#   (default 0.835) for a larger KV pool.\n# Flip the flag, then ./stop-\u2026 && ./start-\u2026 (full restart required).\n#\n# Measured Available KV (this cluster, Anemll 0.1.1, 2026-08-11):\n#   text (flag=0, util 0.835): main ~18.08 GiB / ~2.49M tokens\n#   vision (flag=1, util 0.80 + VL 0.04): main 13.37 GiB / 1.37M + VL 1.54 GiB / 84k\n# Default: off (text-only, larger main KV). Vision/VL coexist is deferred to a\n# follow-up PR \u2014 leave knobs commented; they are unused while the flag is 0.\nENABLE_VL_SIDECAR=0\n# Do not download VL weights on text-only prepare (set 1 only for a vision PR).\nPREPARE_VL_SIDECAR_MODEL=0\n# VL_SIDECAR_MODEL=cyankiwi/Qwen3-VL-4B-Instruct-AWQ-4bit\n# VL_SIDECAR_SERVED_NAME=qwen3-vl-4b\n# VL_SIDECAR_PORT=8889\n# VL_SIDECAR_TP_SIZE=2\n# VL_SIDECAR_NNODES=2\n# VL_SIDECAR_MASTER_PORT=25100\n# VL_SIDECAR_GPU_UTIL=0.04\n# VL_SIDECAR_MAX_NUM_SEQS=4\n# VL_SIDECAR_MAX_MODEL_LEN=32768\n# VL_SIDECAR_KV_CACHE_DTYPE=int4_per_token_head\n# VL_SIDECAR_ATTENTION_BACKEND=TRITON_ATTN\n# Optional: VL_SIDECAR_KV_CACHE_MEMORY_BYTES=367001600\n# VL weights: ./prepare-dspark-model-cache.sh downloads VL_SIDECAR_MODEL on\n# head and worker when PREPARE_VL_SIDECAR_MODEL=1 (TP=2 needs both caches).\n# After sidecar is healthy, start can register MCP into detected harnesses\n# only when ENABLE_VL_SIDECAR=1 (installer also no-ops if the flag is off).\n# INSTALL_VISION_MCP=0 skips harness registration even when vision is on.\n# INSTALL_VISION_MCP=1\n# VISION_MCP_HARNESSES=auto\n# VISION_MCP_HARNESSES=pi,omp,hermes,opencode,goose,grok,openclaw,zcode,prime,factory,commandcode\n\n# --- local: hold issue #26 hybrid prefix-cache hotfix (issue #39 tool-name regression,\n# bisected to #   let h='<table class="lv"><thead><tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+

      h+='<tr'+(c===TC?' class="tc"':'')+'><td class="num c">'+c+'</td>'+
         GRP.map(([k,,d,lo])=>'<td class="num sep">'+(x?f(x[k],d):
           '<span class="dash">not run</span>')+'</td><td class="num">'+(y?f(y[k],d):
           '<span class="dash">not run</span>')+'</td><td class="num">'+
           pct(x&&x[k],y&&y[k],lo)+'</td>').join('')+'</tr>';});
    h+='</tbody></table>';
  }
  const sec=(title,a,b)=>{
    let s='<h3>'+title+'</h3><div class="diff"><div class="h lbl">key</div><div class="h">'+
          who(A,'A')+'</div><div class="h">'+who(B,'B')+'</div>';
    // One side with nothing captured would otherwise render every key as a "difference".
    const na=!Object.keys(a||{}).length, nb=!Object.keys(b||{}).length;
    if(na||nb) return s+'<div class="hint" style="grid-column:1/4">not captured for '+
      esc(na&&nb?'either run':parts(na?A.dir:B.dir).ref)+' - nothing to diff</div></div>';
    const ks=diffKeys(a,b);
    if(!ks.length) s+='<div class="hint" style="grid-column:1/4">identical</div>';
    ks.forEach(k=>{s+='<div><code>'+esc(k)+'</code></div><div class="del"><code>'+
      ((a||{})[k]===undefined?'-':esc((a||{})[k]))+'</code></div><div class="add"><code>'+
      ((b||{})[k]===undefined?'-':esc((b||{})[k]))+'</code></div>';});
    return s+'</div>';};
  h+=sec('serve flag',A.serve_flags,B.serve_flags);
  // Label the section by whichever config file each side actually stored
  // (env.dspark for DeepSeek, env.qwen38fn for the Qwen/vLLM recipe, recipe.yaml
  // for sparkrun) -- labelling a Qwen .env "env.dspark" is how a diff gets misread.
  const ca=A.config_file||'env.dspark', cb=B.config_file||'env.dspark';
  const cfgLabel=ca===cb?ca:ca+' vs '+cb;
  h+=sec(cfgLabel,envMap(A.env_text),envMap(B.env_text));
  const hf=r=>{const o={};Object.entries(r.hotfixes||{}).forEach(([k,v])=>
    o[k]=(v||[]).join(' ')||'(none)');return o;};
  h+=sec('hotfixes applied',hf(A),hf(B));
  el.innerHTML=h;
}

/* ---- events (delegated: the table is re-rendered on every change) ---- */
document.getElementById('tbl').addEventListener('click',e=>{
  const th=e.target.closest('th[data-k]');
  if(th){const k=th.dataset.k;
    sort = sort.k===k ? {k,dir:-sort.dir} : {k,dir:(k==='dir'?-1:1)};
    return draw();}
  const tr=e.target.closest('tr.run'); if(!tr) return;
  const i=+tr.dataset.i, before=sel.length;
  if(e.target.matches('input[type=checkbox]')){
    const at=sel.indexOf(i);
    if(at>=0) sel.splice(at,1); else {if(sel.length===2) sel.shift(); sel.push(i);}
  } else {
    open.has(i) ? open.delete(i) : open.add(i);
  }
  draw();
  if(before<2&&sel.length===2) document.getElementById('panel').showModal();
});
// With no reopen button, closing the popup releases the pair - otherwise two runs stay
// ticked with no way back to their diff. Guarded so the close() that fires when a pair is
// broken by unticking does not also clear the run still selected.
document.getElementById('panel').addEventListener('close',()=>{
  if(sel.length===2){sel=[];draw();}});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value;draw();});
document.getElementById('ver').addEventListener('change',e=>{verOnly=e.target.checked;draw();});
document.getElementById('expand').addEventListener('change',e=>{
  if(e.target.checked) visible().forEach(x=>open.add(x.i)); else open.clear(); draw();});
draw();
</script>
